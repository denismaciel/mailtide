[build-system]
requires = ["uv_build==0.12.4", "packaging==26.2"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mailtide"
version = "0.4.0"
description = "Watertight Gmail sync engine: sans-IO Rust core with Python bindings"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Denis Maciel", email = "denispmaciel@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = []

[project.urls]
Repository = "https://github.com/denismaciel/mailtide"
Issues = "https://github.com/denismaciel/mailtide/issues"

[project.scripts]
mailtide-fake = "mailtide.fake:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<1", "ty>=0.0.97"]

[tool.uv]
required-version = "==0.12.4"
cache-keys = [
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
]

[tool.uv.build-backend]
module-root = "python"
module-name = "mailtide"
source-include = [
  "build_backend.py",
  "Cargo.toml",
  "Cargo.lock",
  "crates/**",
  "rust-toolchain.toml",
  "scripts/**",
]
source-exclude = ["**/*.so", "**/*.pyd", "**/*.dylib"]
wheel-exclude = ["**/*.so", "**/*.pyd", "**/*.dylib"]

[tool.native-build]
module-name = "mailtide._core"
cargo-package = "mailtide-py"
cargo-library = "_core"
abi3-minimum = "cp312"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/reviews"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-* cp314t-* cp315t-*"
build-frontend = "uv"
enable = ["cpython-prerelease"]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.100.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2" }
test-command = "python -W error {project}/scripts/smoke_wheel.py"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.100.0 && curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.12.4/install.sh | sh"
environment = { PATH = "$HOME/.local/bin:$HOME/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2" }
