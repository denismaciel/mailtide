# ------------------------------------------- Gmail behaviour assumed, not proven

[[unknown]]
id = "threads-thread-id-is-stable"
question = "Does a message keep its threadId for life, or can Gmail move an existing message to another thread (for example when a later message references two threads)?"
assumed = "A message's threadId never changes after the message is created."
if_wrong = "History has no record for such a move, so the mirror would show the message in its old thread until the next full observation of it (a verification fetch or a reconciliation), which rewrites the row's thread id and moves it in the views. The feed would carry no entry for the move, so a host's own list would keep the old grouping until it rebuilds: we would then add a ThreadChanged feed entry to the commit that rewrites a thread id."
test = "With messages.insert create message A (new thread, note threadId TA) and message B with an unrelated Subject (threadId TB). Insert C with `References: <A's Message-ID> <B's Message-ID>`, the Subject of A and threadId TA. Then messages.get(format=minimal) A and B, and history.list from the historyId read before inserting C. Expect A in TA and B in TB, unchanged, and no history record naming B. Repeat by sending C through messages.send instead of insert."

[[unknown]]
id = "threads-internal-date-is-gmails-order"
question = "Is the order of `messages` in a users.threads.get answer the order of internalDate, and is Gmail's 'latest' message the one with the greatest internalDate?"
assumed = "Yes: Gmail orders a thread by internalDate, oldest first, as JMAP orders by receivedAt."
if_wrong = "Only presentation differs: our order and `latest` would disagree with Gmail's own UI for messages whose internalDate is not their arrival time (imports with a back-dated Date header). No state is lost. We would then keep the documented internalDate rule and add Gmail's position as a second sort key only if a host needs parity."
test = "In one thread, messages.insert message A with internalDateSource=receivedTime, then message B with internalDateSource=dateHeader and a Date header one year in the past, then message C normally. Call threads.get(format=minimal) and compare the order of `messages` and each internalDate. Expect B first (order follows internalDate, not insertion). Also note whether two messages inserted within the same millisecond come back in id order."

[[unknown]]
id = "threads-label-union-matches-gmails-listing"
question = "Does users.threads.list(labelIds=[L]) return exactly the threads in which at least one message carries L, and does a draft's label count?"
assumed = "A thread is listed under L when any of its messages carries L; a thread whose only message with a given label is a draft is listed under DRAFT but our `labels` leaves that draft's labels out."
if_wrong = "The engine stays correct (it mirrors message labels); a host list built from ThreadView.labels would differ from Gmail's own list for mixed threads. The view carries every member with its labels and draft_count, so the host can apply Gmail's actual rule without an engine change; we would document that rule next to `labels`."
test = "Create a thread of two messages with messages.insert: M1 labelled INBOX, M2 labelled only with a user label U. Call threads.list(labelIds=[U]), threads.list(labelIds=[INBOX]) and threads.list(labelIds=[INBOX, U]); expect the thread in all three (labels match across messages of the thread). Then drafts.create a reply in that thread, messages.modify the draft's message to add STARRED, and call threads.list(labelIds=[STARRED]) and threads.list(labelIds=[DRAFT]); record whether the thread is listed."

[[unknown]]
id = "threads-history-names-the-thread"
question = "Do the message objects in history.list records (messagesAdded, labelsAdded, labelsRemoved) and in messages.list always carry threadId?"
assumed = "Yes, always. The decoder nevertheless accepts a record without it and stores an empty thread id."
if_wrong = "Rows discovered that way would share the empty id until their first full observation (the import or a verification fetch, both of which carry threadId and rewrite it). Fail-safe: the empty id is never a thread, so such messages are not grouped with each other, a read of the empty id answers nothing and a thread action on it admits nothing; the message joins its real thread when its import commits."
test = "On a mailbox with recent activity of every kind (new mail, a label added and removed, a delete, a draft saved), call history.list from an old historyId with every historyTypes value and messages.list(includeSpamTrash=true) over all pages; assert every message object in every record and page has a non-empty threadId."
