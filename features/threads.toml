[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/threads"
note = "Read 2026-11-20. A thread lets a client 'retrieve all messages in a conversation, in order' (which order is not stated); a message joins a thread through threadId, References/In-Reply-To and a matching Subject."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.threads/list"
note = "Read 2026-11-20. labelIds: 'Only return threads with labels that match all of the specified label IDs'; maxResults defaults to 100, at most 500; no order is stated; listed threads carry no messages."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20. threads.get is 40 units (120 with format=full), threads.list 10. This feature calls neither: it costs no quota."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc8621"
note = "§3 Thread: emailIds 'sorted by the receivedAt date of the Email, oldest first', ties stable ('sorting by id is recommended'); the threading algorithm is not mandated. §2 Mailbox totalThreads/unreadThreads. §4.4.3 collapseThreads: a thread appears once in a query result."

