id = "drafts"
title = "Drafts: create, update, delete, list, read and send"
summary = "Draft writes as quota-gated calls to Gmail's drafts API that return Gmail's draft id at once, plus a mirrored draft index (draft id -> current message id, and the X-Mailtide-Id the bytes carry) that follows drafts changed elsewhere and confirms a send whose answer was lost."
roadmap = ["C2"]
status = "in_progress"
design = "docs/features/drafts.md"
# No hard dependency: the API takes RFC 5322 bytes.
#   compose-mime (C1) builds those bytes; send (C3) reuses `send_draft` and owns
#   large uploads; identities (C4) decides which From addresses are allowed.
depends_on = []

