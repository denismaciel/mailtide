[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/drafts"
note = "Read 2026-11-20. A draft is a container with a stable id; its message is destroyed and replaced on update; a draft message has no label but DRAFT; on send the draft is deleted and a new message with a new id and SENT is created and returned."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20. drafts.create 10, drafts.update 15, drafts.delete 10, drafts.send 100, drafts.list 5, drafts.get 20 (60 for full or raw); 6,000 units per minute per user."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/list"
note = "Read 2026-11-20. maxResults defaults to 100, at most 500; each entry's message has only id and threadId; includeSpamTrash; accepted with the gmail.readonly scope."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/get"
note = "Read 2026-11-20. Takes a format; accepted with the gmail.readonly scope."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/send"
note = "Read 2026-11-20. The request body is a Draft, the answer a Message; needs gmail.compose, gmail.modify or full access. States no size limit."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/update"
note = "Read 2026-11-20. PUT replaces a draft's content; metadata and upload URIs; states no size limit and no precondition."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/delete"
note = "Read 2026-11-20. Immediately and permanently deletes the draft; it is not moved to trash."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/uploads"
note = "Read 2026-11-20. Draft create and update accept media uploads (simple, multipart, resumable); 5 MB is given only as an example of a small transfer; size limits are left to each method's page, which states none."

