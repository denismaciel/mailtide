# ------------------------------------------------------------------- unknowns
# Gmail behaviour the design assumes without proof. Paths are relative to
# https://gmail.googleapis.com/gmail/v1/users/me; run them on a test mailbox.
# "To self" means a message addressed to the account itself, with a unique Subject.

[[unknown]]
id = "drafts-send-twice"
question = "Does a second drafts.send of the same draft id return 404 and send nothing?"
assumed = "Yes. A sent draft's id is gone: the second call answers 404 and no second message is created."
if_wrong = "Still safe: a retry never calls drafts.send blind. On a row already marked sending it first calls drafts.get, and a 404 there ends as SendUnconfirmed without sending. Only if drafts-gone-is-404 is wrong too could a retry resend; then a retry on a sending row must be refused until the sync has confirmed or ruled out the first send."
test = "1) POST /drafts {message:{raw}} to self with Subject S; note draft id D. 2) POST /drafts/send {id:D}; expect 200, note message id M1. 3) POST /drafts/send {id:D} again; record status and error body (expect 404). 4) Wait 60 s. GET /messages?q=subject:S in:sent and GET /messages?q=subject:S in:inbox; expect exactly one message in each."
status = "confirmed"
result = "2026-11-20, denis@coverwatch.com, 3 drafts to self: first drafts.send 200 (id, threadId, labelIds [UNREAD, SENT, INBOX]); second drafts.send of the same id 404 NOT_FOUND, reason notFound, message \"Requested entity was not found.\", 3 of 3. 60 s later subject search listed exactly 1 message in:sent and 1 in:inbox each time (a message to oneself is one message carrying SENT and INBOX), and 1 with includeSpamTrash=true. The draft's own message id answered 404 after the send."

[[unknown]]
id = "drafts-send-concurrent"
question = "Do concurrent drafts.send calls for one draft send at most one message?"
assumed = "Yes: Gmail serialises them; one answers 200, the rest 404 or an error, and one message leaves."
if_wrong = "mailtide itself never issues two: saved -> sending is an atomic store transition across processes, and a retry waits out the request timeout and reads the draft first. What stays exposed is a send from another client at the same instant, or a request Gmail is still processing after our timeout; then the wait before a retry must grow to cover Gmail's processing time, or retries on a sending row must be refused until the sync settles it."
test = "1) POST /drafts to self with Subject S; note D. 2) Send 5 POST /drafts/send {id:D} in parallel on separate connections. 3) Record every status. 4) Wait 60 s. GET /messages?q=subject:S in:sent and in:inbox; expect one 200, one sent message, one received copy. Repeat 20 times with fresh drafts."
status = "confirmed"
result = "2026-11-20: 20 fresh drafts to self, each sent by 2 simultaneous drafts.send calls on separate connections (requests left the client 0.1 to 0.6 ms apart; this run was limited to 2 calls in flight, so 2 parallel, not the 5 the test names). 20 of 20: exactly one 200 and one 404 NOT_FOUND (reason notFound); both answers came 0.31 to 0.43 s after the start, so the loser waits and then answers 404, it is not refused early. 60 s later each subject listed exactly 1 message in:sent, 1 in:inbox and 1 with includeSpamTrash=true. No 409, 429 or 5xx was seen."

[[unknown]]
id = "drafts-message-id-kept"
question = "Does Gmail keep a client-supplied Message-ID header through drafts.create, drafts.update and drafts.send?"
assumed = "Yes: the draft read back with format=raw and the SENT message both carry the header exactly as supplied."
if_wrong = "A send whose answer was lost cannot be matched to its SENT message: the row ends as DraftRemoved{send_unconfirmed} after draft_send_grace, and nothing is resent. DraftView.rfc822_message_id must then be read from Gmail's stored copy instead of our bytes, and confirmation needs another key (step 2 and 5 show whether a private X- header survives)."
test = "1) POST /drafts with raw containing `Message-ID: <mailtide-probe-1@example.com>` and `X-Mailtide-Probe: 1`, to self; note D. 2) GET /drafts/D?format=raw; base64url-decode; record both headers. 3) PUT /drafts/D with a new body and the same two headers; GET /drafts/D?format=raw; record them. 4) POST /drafts/send {id:D}; note message id M. 5) GET /messages/M?format=raw; record both headers. 6) GET /messages?q=rfc822msgid:mailtide-probe-1@example.com; expect M (and the received copy). 7) Repeat with a Message-ID on the account's own domain and with a send-as alias in From. Run together with send-message-id-kept and compose-mime-date-kept (one set of probe messages, sent both ways)."
status = "refuted"
result = "2026-11-20: Gmail does not keep a client Message-ID on any draft call. drafts.create stored the draft with `Message-Id: <CA+...@mail.gmail.com>` of its own in place of the supplied `Message-ID: <mailtide-probe-...@example.com>`; every drafts.update assigned another new one; drafts.send assigned a third. Seen on 5 of 5 drafts (3 with an example.com id, 1 with an id on the account's own domain, 1 with no Date), and the supplied id never came back: rfc822msgid:<supplied id> listed nothing (includeSpamTrash=true) after 40 s. With no Message-ID supplied Gmail adds one the same way. The private header `X-Mailtide-Probe: 1` was kept byte for byte in the stored draft, after update and in the SENT message, 6 of 6. The draft's Date header is also rewritten to the save time (see compose-mime-date-kept). Not run: a send-as alias in From (the account has only its primary identity). So the draft's Message-ID is not a stable key: read it from Gmail's copy after each save, and expect a new one on send; if_wrong applies."

[[unknown]]
id = "drafts-raw-json-limit"
question = "What is the largest message drafts.create, drafts.update and messages.send accept in the JSON `raw` field (metadata URI)?"
assumed = "At least 3 MiB of RFC 5322 bytes (a JSON body a little over 4 MiB). draft_inline_limit defaults to 3 MiB until this is measured."
if_wrong = "If the limit is lower, Gmail refuses the save: nothing is stored and the host gets Refused; lower the default below the measured size. If it is much higher, raise the default so fewer drafts wait for the upload endpoint."
test = "For each size in 1, 2, 3, 4, 5, 8, 12, 16, 24, 32 MiB: build a message with one attachment padding it to that size; POST /drafts {message:{raw}} as application/json; record status and error reason. For the largest size accepted: PUT /drafts/D with a message of the same size, then GET /drafts/D?format=raw and compare the decoded length. DELETE every draft created. Then POST /messages/send {raw} to self for the same sizes and record status: send's 2 MiB send_inline_limit rests on this figure too. Run together with drafts-upload-limit and send-size-limit (one ladder of padded messages)."
status = "confirmed"
result = "2026-11-20: no limit was reached on the metadata URI up to the largest size tried. drafts.create with JSON `raw` answered 200 for messages of 1, 2, 3, 4, 5, 8, 12, 16, 24, 32, 34, 35, 36 and 40 MiB of RFC 5322 bytes (the 40 MiB one is a JSON body of 55.9 MB; 5 to 7 s each). drafts.update with a 40 MiB message: 200; drafts.get format=raw returned 41,943,243 decoded bytes = the 41,943,040 submitted plus 203 bytes of headers Gmail adds or rewrites (Received, Message-Id, Date); the body was byte-identical. messages.send {raw} to self also answered 200 for every one of those sizes, but that is not delivery: the 35, 36 and 40 MiB sends were each followed within seconds by a mailer-daemon notice `An error occurred. Your message was not sent.` (34 MiB and below were not; see send-size-limit). So the JSON route takes at least 40 MiB, more than the upload URI's 36,700,160 bytes; draft_inline_limit and send_inline_limit can be raised as far as memory and base64 overhead make sensible. Sizes above 40 MiB were not tried."

[[unknown]]
id = "drafts-upload-limit"
question = "What is the largest message the upload URIs accept for a draft?"
assumed = "35 MB, the figure older reference pages gave; today's pages state none. This feature does not use the upload URIs: larger content is refused locally with TooLarge until the send feature's upload path exists."
if_wrong = "Only the documented ceiling changes. Gmail refuses an oversize upload itself, which maps to TooLarge."
test = "POST https://gmail.googleapis.com/upload/gmail/v1/users/me/drafts?uploadType=media with Content-Type: message/rfc822 and bodies of 20, 25, 30, 34, 35, 36, 40 MiB; record status. Retry the smallest refused size with uploadType=resumable. For the largest accepted draft addressed to self, POST /drafts/send {id} and record whether send applies a lower limit. DELETE the rest. Run together with drafts-raw-json-limit and send-size-limit (one ladder of padded messages)."
status = "confirmed"
result = "2026-11-20: the upload URI for drafts takes at most 36,700,160 bytes (35 MiB). uploadType=media with message/rfc822 bodies of 20, 25, 30, 34 and 35 MiB: 200. 36,700,161 bytes, 36 MiB and 40 MiB: HTTP 413, error.status FAILED_PRECONDITION, reason failedPrecondition, message \"Media is too large. Limit: 36700160\". uploadType=resumable for 36 MiB: the initiating request is accepted (200, although X-Upload-Content-Length declared the size), every 8 MiB chunk answers 308, and only the final chunk answers the same 413, so the refusal comes after the whole upload. drafts.send of the 35 MiB draft answered 200 with a SENT message, but a mailer-daemon notice `An error occurred. Your message was not sent.` followed 1 s later: send applies a lower effective limit than draft storage (see send-size-limit). The metadata URI (JSON raw) accepted drafts up to 40 MiB (drafts-raw-json-limit)."

[[unknown]]
id = "drafts-sent-thread"
question = "Is the message that drafts.send returns in the draft's thread?"
assumed = "Yes, for a new conversation and for a reply draft."
if_wrong = "Nothing breaks: SentDraft and DraftSent carry the thread id from Gmail's answer or from the imported SENT message, never the row's, and a lost send is matched by Message-ID in any thread. A host that showed the draft in a thread must move it on DraftSent."
test = "1) POST /drafts to self without threadId; note message.threadId T1. POST /drafts/send {id}; record the answer's keys, its threadId (expect T1) and labelIds (expect SENT, no DRAFT). 2) Pick an INBOX message with thread T2 and Message-ID X. POST /drafts {message:{raw with In-Reply-To: X, References: X, Subject `Re: ...`, threadId:T2}}; POST /drafts/send; expect threadId T2. 3) GET /threads/T1?format=minimal and /threads/T2?format=minimal; expect the sent messages listed."
status = "confirmed"
result = "2026-11-20, 3 new-conversation drafts and 3 reply drafts (threadId T2, In-Reply-To and References naming a message of T2, Subject `Re: ...`), all to self: drafts.send answered 200 with exactly the keys id, threadId, labelIds; threadId was the draft's thread every time (T1 for the new ones, T2 for the replies); labelIds [UNREAD, SENT, INBOX] (SENT, no DRAFT; UNREAD and INBOX because the recipient is the sender); the id differs from the draft's message id. threads.get(format=minimal) on T1 and T2 listed the sent messages. Note for callers: a reply draft created without threadId (headers only) did not join T2."

[[unknown]]
id = "drafts-update-keeps-thread"
question = "Does drafts.update without threadId keep a reply draft in its thread?"
assumed = "Not relied on. The design assumes the worse answer (Gmail may re-thread it), so update_draft always sends a thread id: the caller's, else the index's, else one read with drafts.get."
if_wrong = "Either answer is safe. If Gmail does keep the thread, the drafts.get fallback (20 units, only for a draft the index has never seen) can be dropped."
test = "1) Create a reply draft D in thread T2 as in drafts-sent-thread step 2. 2) PUT /drafts/D {message:{raw}} with the same headers, a new body and no threadId; record the answer's message.threadId. 3) PUT again without threadId and with a changed Subject; record it. 4) PUT again without threadId and without In-Reply-To and References; record it. 5) GET /drafts/D?format=minimal after each."
status = "confirmed"
result = "2026-11-20: the worse answer the design assumes is what Gmail does. A reply draft created in thread T2 left T2 on every drafts.update sent without threadId: with the same In-Reply-To, References and `Re:` Subject and only a new body; with a changed Subject; without In-Reply-To and References; and with neither (12 of 12 updates over 3 drafts: the answer's message.threadId and a following drafts.get both showed a thread other than T2). An update that sent threadId T2 again put it back in T2 (3 of 3). So update must always send the thread id and the drafts.get fallback stays."

[[unknown]]
id = "drafts-update-resend-thread"
question = "Is an update that sends the draft's own thread id accepted when the draft is the only message in that thread, and does the draft keep that thread?"
assumed = "Yes."
if_wrong = "The rule `update always sends the thread id` would fail or re-thread standalone drafts. Then send threadId only when the mirror shows another message in the thread, and depend on drafts-update-keeps-thread for the rest."
test = "1) POST /drafts without threadId; note D, message id M1, thread T1. 2) PUT /drafts/D {message:{raw, threadId:T1}}; expect 200, a new message id, threadId T1. 3) PUT again with threadId T1 and a different Subject; record status and threadId. 4) GET /threads/T1?format=minimal; expect one message, the draft's current one."
status = "confirmed"
result = "2026-11-20, 3 standalone drafts: drafts.update with message.threadId set to the draft's own thread T1 answered 200 with a new message id and threadId T1; a second update with T1 and a different Subject also 200 with threadId T1. threads.get(T1, format=minimal) then held exactly one message, the draft's current one. T1 equals the id of the draft's first message, which no longer exists after the first update, and is still accepted. After drafts.delete, threads.get(T1) is 404."

[[unknown]]
id = "drafts-list-consistent"
question = "Does drafts.list show a draft change as soon as history.list has shown it?"
assumed = "Yes."
if_wrong = "The index can lag but heals. A listing naming a message the mirror knows is deleted is discarded and retried; one that omits a new draft or still lists a deleted one is corrected by the next draft change or by the periodic refresh, at most 15 minutes later. No write or send depends on the index being current: writes go by draft id and if_message_id asks Gmail."
test = "GET /profile; note historyId H. Repeat 50 times: a) POST /drafts; poll GET /history?startHistoryId=H until the new message's messagesAdded appears; at once GET /drafts?maxResults=500 (all pages); record whether D with that message id is listed. b) PUT /drafts/D; poll history for the old message's messagesDeleted; list at once; record whether D carries the new message id. c) DELETE /drafts/D; poll history for messagesDeleted; list at once; record whether D is absent. Report the number of stale listings and the longest lag. Run together with label-edit-list-consistency and identities-read-after-write (the same loop: write, then list at once; a different endpoint each, so a separate answer each)."
status = "confirmed"
result = "2026-11-20, 50 rounds of create, update, delete: each time history.list (polled from the historyId read before the round) first showed the change, drafts.list (all pages) read at once agreed with it: the new draft listed with its message id 50 of 50, the updated draft listed with its new message id 50 of 50, the deleted draft absent 50 of 50; 0 stale listings, so no lag to report. History itself showed the change on the first read after the write (0.22 to 0.27 s after the answer) in 149 of 150 cases; once, after a drafts.delete, the messagesDeleted record appeared only on a read 1.6 s after the answer. Run alone; the labels and settings loops were separate runs."

[[unknown]]
id = "drafts-history-on-save"
question = "Do draft create, update and delete appear in history.list as messagesAdded (labelIds with DRAFT) and messagesDeleted for the draft's messages?"
assumed = "Yes: create adds M1 [DRAFT]; update adds M2 [DRAFT] and deletes M1; delete deletes M2."
if_wrong = "Rows would not turn stale and drafts made elsewhere would not trigger a refresh, so the index would be only as fresh as the periodic refresh, and replaced draft messages would stay in the mirror until a reconciliation. The periodic interval would have to drop for accounts with drafts."
test = "GET /profile; note H. POST /drafts; note D, M1. PUT /drafts/D; note M2. DELETE /drafts/D. GET /history?startHistoryId=H (all pages, no historyTypes or labelId filter); expect, in order, messagesAdded M1 with labelIds [DRAFT], messagesAdded M2 with [DRAFT], messagesDeleted M1, messagesDeleted M2. Repeat while typing, then discarding, a draft in Gmail's web UI. Run together with drafts-history-on-send and send-history-on-send (one history window read after each call)."
status = "confirmed"
result = "2026-11-20, 3 rounds, history.list from the historyId read before, no filter, read after each call: create -> messagesAdded M1 labelIds [DRAFT]; update -> messagesDeleted M1 [DRAFT] then messagesAdded M2 [DRAFT]; delete (204) -> messagesDeleted M2 [DRAFT]. Every record was present in the read made right after the call. Order differs from the test's expectation in one place: on update the messagesDeleted for the old message comes first (record id n), the messagesAdded for the new one next (n+1), so a reader between the two sees the draft with no message. Not run: typing and discarding a draft in Gmail's web UI."

[[unknown]]
id = "drafts-history-on-send"
question = "Does sending a draft appear in history.list as messagesDeleted for the draft's message and messagesAdded for a new SENT message?"
assumed = "Yes: the sent message has a new id and the SENT label, and the draft's message id answers 404 afterwards."
if_wrong = "If Gmail relabels the same message instead (labelsRemoved DRAFT, labelsAdded SENT), no tombstone marks the row stale and a draft sent elsewhere stays saved until a refresh. The mirror rule must then also schedule a refresh when DRAFT leaves a message a row points at; until it does, the periodic refresh bounds the lag."
test = "GET /profile; note H. POST /drafts to self; note D, M1. POST /drafts/send {id:D}; note S. GET /history?startHistoryId=H (all pages); record every record naming M1 or S. GET /messages/S?format=minimal; record labelIds. GET /messages/M1?format=minimal; expect 404. Repeat sending the draft from Gmail's web UI. Run together with drafts-history-on-save and send-history-on-send (one history window read after each call)."
status = "confirmed"
result = "2026-11-20, 6 drafts to self (3 new, 3 replies): history.list read right after drafts.send answered held messagesDeleted for the draft's message M1 (labelIds [DRAFT]) and messagesAdded for a new message S with labelIds [UNREAD, SENT, INBOX] (SENT and INBOX together because the recipient is the sender), 6 of 6 on the first read and unchanged 2 s later. S has a new id; messages.get(S) shows the same labels; messages.get(M1) is 404 notFound. No labelsRemoved/labelsAdded relabelling was seen. Not run: sending the draft from Gmail's web UI."

[[unknown]]
id = "drafts-gone-is-404"
question = "Do drafts.get, drafts.update, drafts.delete and drafts.send answer 404 for a draft that was deleted or sent?"
assumed = "Yes. himalaya's live check records 404 for get after delete; the other calls and the after-send case are inferred."
if_wrong = "NotFound and AlreadyGone key on 404 alone; any other status is Refused, which never counts as success. A delete retry would then report an error instead of AlreadyGone and a send retry would send nothing. Map the measured status once known."
test = "1) POST /drafts; note D. DELETE /drafts/D; expect 204. Then GET /drafts/D, PUT /drafts/D {message:{raw}}, DELETE /drafts/D, POST /drafts/send {id:D}; record status and error reason of each. 2) POST /drafts to self; note D2. POST /drafts/send {id:D2}. Then the same four calls for D2; record each."
status = "confirmed"
result = "2026-11-20, 3 drafts deleted (drafts.delete 204) and 3 drafts sent: afterwards drafts.get, drafts.update, drafts.delete and drafts.send on the same id each answered 404, error.status NOT_FOUND, reason notFound, message \"Requested entity was not found.\" (24 of 24 calls). A draft id that never existed and a malformed one answer the same 404."

[[unknown]]
id = "drafts-id-namespace"
question = "Does drafts.get answer 404 when given a message id instead of a draft id?"
assumed = "Yes: draft ids and message ids are separate namespaces."
if_wrong = "Already guarded: a drafts.get answer whose message lacks the DRAFT label decodes to not found, so a non-draft is never returned as an editable draft."
test = "GET /drafts/{id}?format=minimal with a) the id of an INBOX message, b) the message id of an existing draft (not its draft id), c) the message id drafts.send returned for a sent draft; record status and, on 200, the answer's id and labelIds."
status = "confirmed"
result = "2026-11-20: drafts.get(format=minimal) answered 404 NOT_FOUND (reason notFound) when given a) the id of a message in INBOX, b) the message id of an existing draft, c) the message id drafts.send had returned; the draft's own id answered 200 with labelIds [DRAFT]. Draft ids here look like `r` plus an optional `-` and up to 19 digits; message ids are 16 hex digits."

[[unknown]]
id = "drafts-write-answer-ids"
question = "Do drafts.create and drafts.update answers always carry id, message.id and message.threadId?"
assumed = "Yes."
if_wrong = "A write whose answer lacks them is completed with one drafts.get?format=minimal (20 units) before it is recorded; if that fails the call returns OutcomeUnknown and a refresh is scheduled. No row is ever written with an empty id."
test = "POST /drafts and PUT /drafts/D on the metadata URI, 20 times each, for a standalone draft and for a reply draft with threadId; record the JSON keys of every answer and of answer.message."
status = "confirmed"
result = "2026-11-20: 20 drafts.create and 20 drafts.update on the metadata URI for a standalone draft, and the same for a reply draft with threadId (80 answers): every answer had exactly the keys {id, message} and message had exactly {id, threadId, labelIds}; none lacked an id."

[[unknown]]
id = "drafts-no-precondition"
question = "Does Gmail honour an HTTP precondition (ETag with If-Match) on drafts.update or drafts.send?"
assumed = "No: the reference pages mention none, so if_message_id is a read with drafts.get followed by the write, with a small race between them."
if_wrong = "Good news: send the precondition with the write and drop the separate read (20 units and the race)."
test = "1) POST /drafts; note D. GET /drafts/D?format=minimal; record any ETag header and any etag field. 2) PUT /drafts/D with header `If-Match: \"bogus\"`; record status (200 means ignored, 412 means honoured). 3) If an ETag was returned: PUT with it (expect 200), then PUT with the old one again (expect 412 if honoured). 4) Same with POST /drafts/send {id:D} and `If-Match: \"bogus\"` on a draft to self."
status = "confirmed"
result = "2026-11-20: drafts.create and drafts.get return no ETag header and no etag field. drafts.update with `If-Match: \"bogus\"` answered 200 and replaced the draft (2 of 2), as did `If-Unmodified-Since` set to the year 2000; drafts.send with `If-Match: \"bogus\"` answered 200 and sent the message. Gmail ignores HTTP preconditions on drafts."
