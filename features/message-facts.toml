# ------------------------------------------------ Gmail behaviour not proven

[[unknown]]
id = "message-facts-raw-bytes-stable"
question = "Does messages.get?format=raw return byte-identical content for one message id on every read?"
assumed = "Yes. Google says content is immutable but does not say the raw serialisation is. A part reference is a byte range in the blob we stored, and a retried import may write the blob again."
if_wrong = "A second write of different bytes would leave ranges pointing at the wrong place. Safe side as designed: a reference names the raw length it was computed against, a part read refuses (stale) when the stored object's length differs, and refresh_facts re-extracts any row whose blob length differs from the row's size. Bytes of the same length in a different arrangement would go unnoticed, so if this is refuted the blob write becomes create-only and the facts are computed from the bytes already stored."
test = "For three messages (plain text; multipart with a base64 attachment; one sent from the Gmail web UI): GET users/me/messages/{id}?format=raw and record sha256 of the decoded raw. Change the message's labels with messages.modify, wait a day, GET again, and once more a week later. Expect the same sha256 each time."

[[unknown]]
id = "message-facts-has-attachment-parity"
question = "Which parts does Gmail itself count as attachments (the has:attachment operator and the paperclip)?"
assumed = "The same as our rule: a part counts unless an HTML body shows it through cid:, it is declared inline, it is an undeclared later child of multipart/related, or it is a signature or encryption part."
if_wrong = "Our paperclip differs from Gmail's on those messages. Nothing is lost: the summary stores each part's declared disposition, whether it is referenced and whether it sits in multipart/related, so the rule is one pure function that can change without reading a blob again; only the two stored counts need a refresh, by bumping the facts version."
test = "With messages.insert (25 units each) add seven messages to a test mailbox, each a text/html body plus one image: (a) multipart/related, inline, Content-ID referenced by cid:; (b) the same but Content-Disposition: attachment; (c) multipart/mixed, Content-Disposition: inline, not referenced; (d) multipart/mixed, no disposition, no Content-ID; (e) multipart/related, no disposition, Content-ID not referenced; (f) multipart/signed with an application/pgp-signature part and no other file; (g) multipart/alternative with a text/calendar part. Then messages.list?q=has:attachment and note which of the seven ids come back; also note which show a paperclip in the web UI. Our rule answers (d) and (g) only; record the actual set for both the operator and the paperclip."
status = "refuted"
result = "2026-11-20, the seven shapes inserted twice (image part with and without a file name) plus two controls: q=has:attachment returned all of (a) to (g), not only (d) and (g): the image referenced by cid: and declared inline (a), the referenced image declared attachment (b), the unreferenced inline image in multipart/mixed (c), the undeclared image in mixed (d), the unreferenced Content-ID image in related (e), the multipart/signed message whose only other part is application/pgp-signature (f; also with application/pkcs7-signature), and the multipart/alternative with text/calendar (g). Only the control with a single text/html part was not returned. Same set at 0, 20, 60 and 120 s after indexing. So the operator counts every part that is not a text body; whether the part has a file name makes no difference. messages.get(format=full) gives each such part a body.attachmentId, and reports filename `invite.ics` for the unnamed text/calendar part. Not checked: the paperclip in the web UI. if_wrong applies for parity with the operator."

