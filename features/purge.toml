note = "`delete(id)` is a bare messages.delete with no check. `deleteAllSpam` does not delete: it pages the spam folder and moves each thread to TRASH. Zero never destroys mail in bulk."

[[reference]]
impl = "zero"
path = "apps/server/src/routes/agent/index.ts"
symbols = ["deleteAllSpam", "bulkDelete", "ensureSpamRecovery", "scheduleSpamAt"]
note = "`bulkDelete` is setThreadLabels(TRASH); spam cleanup is admitted durably and trashes through the label outbox, so a newer user restore wins. The reversible half of this roadmap item is therefore already possible in mailtide with MoveToTrash actions."

[[reference]]
