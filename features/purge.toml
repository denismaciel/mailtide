path = "apps/server/src/lib/mail-cleanup-store.ts"
symbols = ["admit"]
note = "The durable spam cleanup (its suite is owned by scripts/zero_tests.py and already ported). The rule we carry over to the irreversible case: a cleanup never overrides a restore the user made after it was listed."

