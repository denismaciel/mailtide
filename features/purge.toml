# ------------------------------------------- Gmail behaviour assumed, to test

[[unknown]]
id = "purge-history-after-delete"
question = "After messages.delete or messages.batchDelete answers 2xx, does history.list from a history id read just before already contain a messagesDeleted record for every deleted message?"
assumed = "Yes: the deletion is applied before the answer, and its history records are readable at once."
if_wrong = "Safe: a message without a record is reported as `sent`, keeps its row, and is tombstoned by the next sync when the record appears. Only the outcome is less definite; if records are routinely late, purge waits for them for a bounded time (a second history read after one second) before answering."
test = "With a full-scope token: 1) messages.insert 6 small messages with labelIds [TRASH]. 2) getProfile, note historyId H. 3) messages.delete the first; at once history.list startHistoryId=H: expect a messagesDeleted record with its id. 4) messages.batchDelete the other five; at once history.list startHistoryId=H following every page: record how many of the five have a messagesDeleted record, and repeat the read after 1 s, 5 s and 30 s until all five appear. 5) messages.get each id: expect 404."

[[unknown]]
id = "purge-batch-delete-partial"
question = "What does messages.batchDelete do when some ids no longer exist or are malformed: delete the rest and answer 2xx, or refuse the whole call?"
assumed = "It deletes every id that exists and answers 2xx (`no guarantees that messages were not already deleted or even existed at all`)."
if_wrong = "Safe: a refused call deletes nothing, history shows no messagesDeleted, and the chunk's ids are reported as refused with Gmail's message. The remedy is to send that chunk again as single messages.delete calls (10 units each), which answer per id."
test = "1) Insert three messages A, B, C in TRASH; messages.delete B. 2) getProfile, note H. 3) messages.batchDelete {ids: [A, B, C]}: record the status. 4) history.list from H: record which ids have messagesDeleted. 5) Insert D; messages.batchDelete {ids: [D, 'not-an-id']}: record the status and whether D is gone (messages.get D)."

[[unknown]]
id = "purge-batch-delete-limit"
question = "How many ids does one messages.batchDelete call accept?"
assumed = "1,000, as messages.batchModify documents for itself; the reference only shows 133 working."
if_wrong = "Safe: a call over the limit is refused whole (nothing deleted), and reported as refused. The chunk size is one constant."
test = "Insert 1,001 small messages in TRASH (messages.insert, 25 units each). 1) messages.batchDelete with 1,000 ids: expect 2xx and, via history.list, 1,000 messagesDeleted records. 2) Insert 1,000 more and call batchDelete with 1,001 ids: record the status and error body, and whether any of them was deleted."

[[unknown]]
id = "purge-scope-refusal"
question = "With a token that has gmail.modify but not https://mail.google.com/, what exactly do messages.delete and messages.batchDelete answer?"
assumed = "HTTP 403 with reason insufficientPermissions (status PERMISSION_DENIED, ACCESS_TOKEN_SCOPE_INSUFFICIENT), and nothing is deleted."
if_wrong = "Safe: any 4xx to a delete call is the caller's error, never an account block and never a tombstone. If the reason differs the error is the generic Refused with Gmail's message instead of ScopeRequired."
test = "Mint a token with only https://www.googleapis.com/auth/gmail.modify. 1) Insert a message M in TRASH with a full-scope token. 2) With the modify token call messages.delete M: record status, error.status, error.errors[].reason and error.details. 3) Same for messages.batchDelete {ids: [M]}. 4) messages.get M with either token: expect it to exist. 5) Repeat with a gmail.readonly token."
status = "confirmed"
result = "2026-11-20: messages.delete on an inserted message in TRASH with a token holding only gmail.modify: HTTP 403, error.status PERMISSION_DENIED, errors[].reason insufficientPermissions, message \"Request had insufficient authentication scopes.\", details[0] = google.rpc.ErrorInfo {reason: ACCESS_TOKEN_SCOPE_INSUFFICIENT, domain: googleapis.com, metadata.method: caribou.api.proto.MailboxService.DeleteMessage, metadata.service: gmail.googleapis.com}; no WWW-Authenticate header. 3 of 3 identical; a gmail.readonly token got the same answer. messages.get afterwards: 200, still in TRASH. messages.batchDelete was not probed (this run was allowed the messages.delete probe only)."

[[unknown]]
id = "purge-delete-missing"
question = "What does messages.delete answer for an id that was already permanently deleted?"
assumed = "HTTP 404 notFound, as messages.get and messages.modify do for an unknown id (himalaya's run against Gmail saw 404 for those two)."
if_wrong = "Safe: only a 404 is read as `gone`. A 2xx for a missing id proves nothing and tombstones nothing by itself, because tombstones come from the history read; any other answer is a refusal."
test = "1) Insert a message M in TRASH; messages.delete M: expect 2xx (record whether 200 or 204 and the body). 2) messages.delete M again: record status and error body. 3) messages.delete with a well-formed id that never existed (16 hex digits) and with 'not-an-id': record both."

[[unknown]]
id = "purge-history-freshness"
question = "Is a label change made by another client visible in history.list as soon as that client's call has returned?"
assumed = "Yes: history.list read after a messages.untrash or messages.modify has completed contains its labelsRemoved or labelsAdded record."
if_wrong = "This is the one place a wrong assumption can cost mail: a message restored elsewhere within Gmail's history lag would still look trashed and be purged. The window is that lag, not the mirror's age. If the test shows a lag of more than a second or two, the pre-check for explicit purges changes to messages.get (minimal, 20 units a message, as himalaya does) and empty reads messages.list with labelIds for the bin instead of history."
test = "1) Insert a message M in TRASH; getProfile, note H. 2) From client A call messages.untrash M; the moment it returns, from client B call history.list startHistoryId=H: expect a labelsRemoved record naming TRASH for M. Repeat 50 times with fresh messages and record every miss and how long until the record appears. 3) Same with messages.modify removeLabelIds [TRASH] and with messages.batchModify over 100 messages."
