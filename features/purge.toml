[[suite.test]]
name = "a_trash_removal_destroys_only_what_the_trash_alone_holds"
na = "JMAP mailboxes are separate containers, so an email in the trash and elsewhere only leaves the trash. In Gmail TRASH is a label that puts the whole message in the trash whatever else it carries; our own a_trashed_message_with_user_labels_is_purged states the Gmail rule"

# The three tests of himalaya's permanent delete in its Gmail backend. `search`
# declares the suite for its paging tests and left these here.
[[suite]]
impl = "himalaya"
path = "src/gmail/backend.rs"
target = "crates/mailtide-io/tests/ref_himalaya_gmail_backend.rs"

[[suite.test]]
name = "a_lookup_keeps_the_ids_carrying_the_label"
test = "a_message_restored_elsewhere_since_the_last_sync_is_not_purged"
note = "himalaya reads each id (messages.get) and keeps those carrying the mailbox label. Ours folds history since the cursor over the mirror: the mirror still shows TRASH, history shows the restore, the id is refused as not_in_trash_or_spam and no delete names it. The reference's other half (a 403 throttle is a rate limit, not a refusal) is our own a_missing_scope_refusal_is_told_from_a_rate_limit."

[[suite.test]]
name = "a_write_answered_404_is_not_found"
test = "a_single_delete_answered_404_is_sent_and_tombstoned_only_by_history"
note = "himalaya reads a 404 as not found. Ours reports it as sent and tombstones nothing: purge-delete-missing is unsettled, a proxy can answer 404 for a live message, and a tombstone never heals. The history record makes the tombstone at the next sync."

[[suite.test]]
name = "unknown_ids_are_told_from_other_failures"
test = "a_malformed_id_is_refused_by_gmail_and_tombstones_nothing"
note = "400 `Invalid id value` is a refusal of that id (gmail_refused), not a deletion; other failures keep their own class."

[[suite]]
impl = "himalaya"
path = "src/shared/message/delete.rs"

[[suite.test]]
name = "a_queued_delete_says_it_is_queued"
na = "Receipt text of a backend that queues its writes. A mailtide purge is never queued: it happens while the caller waits or not at all"

[[suite.test]]
name = "an_unknown_id_prints_after_the_sentence"
na = "CLI text layout; PurgeOutcome reports refused ids as data"

[[suite.test]]
name = "a_flag_delete_advises_an_expunge_only_when_it_flagged"
na = "IMAP without UIDPLUS (flag, then expunge later). Gmail's delete is immediate"

[[suite]]
impl = "himalaya"
path = "tests/google.rs"
target = "crates/mailtide-io/tests/ref_himalaya_google.rs"
rest_na = "Live checks against Google that need real credentials (account check, mailbox and envelope listings, the IMAP path). Only the write lifecycle has a purge step."

[[suite.test]]
name = "gmail_writes"
test = "a_message_is_trashed_then_purged_and_an_unknown_id_is_reported"
note = "The reference runs against real Gmail and is ignored without credentials. Ours runs the last two steps (trash through an action, then purge beside a bogus id) against the fake Gmail."

