# ------------------------------------------------------------- other sources

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/delete"
note = "Read 2026-11-20: `Immediately and permanently deletes the specified message. This operation cannot be undone. Prefer messages.trash instead.` The only scope listed is https://mail.google.com/ (gmail.modify is not enough)."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/batchDelete"
note = "Read 2026-11-20: `Deletes many messages by message ID. Provides no guarantees that messages were not already deleted or even existed at all.` Body {ids}; empty answer; no stated maximum; the only scope listed is https://mail.google.com/."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.history/list"
note = "messagesDeleted records name each message `deleted (not Trashed) from the mailbox`: the evidence a tombstone rests on. labelsAdded and labelsRemoved carry the label ids, which the pre-check folds."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20: messages.delete 10, messages.batchDelete 50, threads.delete 20, history.list 2, messages.trash 20."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc8621#section-4.6"
note = "Email/set destroy: `the Email is removed from all Mailboxes` and gone for good; the answer lists destroyed and notDestroyed ids."

