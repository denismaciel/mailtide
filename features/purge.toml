name = "empty_skips_messages_restored_while_it_runs"
covers = "The rolling history read between chunks removes ids that left the trash from the chunks still to send"

[[test]]
target = "crates/mailtide-io/tests/purge.rs"
name = "empty_stops_at_its_budget_and_reports_the_rest"
covers = "remaining > 0; a second call is a new request that reads the mirror again"

[[test]]
target = "crates/mailtide-io/tests/purge.rs"
name = "a_purge_refusal_does_not_block_the_account"
covers = "A 403 or 400 from a delete call is the caller's error; no AccountOp::Block is committed"

