note = "Scopes, read 2026-11-20: any of gmail.settings.basic, mail.google.com, gmail.modify, gmail.readonly. The list includes the primary address. The same four scopes are listed for getVacation, filters.list, forwardingAddresses.list and getAutoForwarding."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.settings.sendAs/patch"
note = "Scopes, read 2026-11-20: gmail.settings.basic or gmail.settings.sharing. The update page adds: Gmail sanitizes the signature HTML before saving, and addresses other than the primary can only be updated by service accounts with domain-wide authority."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.settings.sendAs/create"
note = "Scope, read 2026-11-20: gmail.settings.sharing only, service accounts with domain-wide authority only. The same holds for sendAs.delete, forwardingAddresses.create and updateAutoForwarding: the writes this plan leaves out."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.settings/updateVacation"
note = "PUT of a whole VacationSettings, answered with the stored one; scope gmail.settings.basic only. Read 2026-11-20."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/VacationSettings"
note = "Fields, read 2026-11-20: startTime and endTime are epoch milliseconds; the HTML body wins over the plain one and is sanitized; a subject or a body is required to auto-reply; restrictToDomain applies to Workspace only."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.settings.filters"
note = "Filter, Criteria and Action; methods are create, delete, get and list only (no update), list is unpaged, at most 1,000 filters; create and delete need gmail.settings.basic. Read 2026-11-20."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/AutoForwarding"
note = "enabled, emailAddress, disposition (leaveInInbox, archive, trash, markRead). Read 2026-11-20."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Costs, read 2026-11-20: every settings get and list is 1 unit; sendAs update 100 (patch is not listed), create 100, verify 100, delete 5; updateVacation 5; filters create 5, delete 5; forwardingAddresses create 100; updateAutoForwarding 5."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/auth/scopes"
note = "gmail.settings.basic and gmail.settings.sharing are restricted scopes; sharing is for Workspace service accounts with domain-wide delegation. Read 2026-11-20."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.history/list"
note = "History records are messagesAdded, messagesDeleted, labelsAdded and labelsRemoved: nothing for settings. Read 2026-11-20."

