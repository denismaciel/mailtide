# ------------------------------------- Gmail behaviour assumed, not proven

[[unknown]]
id = "identities-settings-leave-no-history"
question = "Does changing a setting (a signature, the vacation responder, a filter) add a history record, advance the mailbox historyId, or publish a push notification?"
assumed = "No. history.list documents only message and label records, so mailtide cannot learn of a settings change from the sync it already runs and must poll (RefreshSettings every settings_refresh, default 6 h) or be asked (refresh_settings)."
if_wrong = "Safe as designed: polling stays correct, only slower than it could be. If the historyId does move, add a store rule that makes RefreshSettings due when a history pass advances the cursor with no records, and shorten nothing else."
test = "On a test mailbox with users.watch active on a Pub/Sub topic: 1) users.getProfile, note historyId H. 2) settings.sendAs.patch the primary address with a new signature. 3) settings.updateVacation toggling enableAutoReply. 4) settings.filters.create then delete a filter. After each step wait 60 s, then call users.getProfile and users.history.list?startHistoryId=H and pull the subscription. Expect: historyId still H (or advanced only with zero records returned), no history records, no notification."

[[unknown]]
id = "identities-patch-quota-cost"
question = "What does settings.sendAs.patch cost? Google's quota table lists sendAs update (100) but not patch."
assumed = "100 units, the same as update."
if_wrong = "If it is cheaper we over-reserve and stay inside the budget: safe. If it were dearer the quota gate would under-count; correct the constant in quota.rs."
test = "In a Cloud project used for nothing else, as one user: call settings.sendAs.patch on the primary address 10 times within a minute (alternating two signatures). Read the Gmail API metric 'Quota units per minute per user' (Cloud console, APIs & Services, Gmail API, Quotas) for that minute. Expect about 1,000 units."

[[unknown]]
id = "identities-patch-answer-is-stored-state"
question = "Is the body sendAs.patch (and updateVacation) answers with the state Gmail stored (sanitized HTML, a display name an admin setting silently refused to change), or an echo of the request?"
assumed = "The stored state. update_identity and set_vacation record the answer in the mirror and return it."
if_wrong = "The mirror would hold HTML Gmail did not store until the next refresh. Change the two writes to follow with settings.sendAs.get or getVacation (1 unit each) and record that reading instead."
test = "1) settings.sendAs.patch the primary address with signature '<p onclick=\"x()\">Hi<script>alert(1)</script></p>'; keep the response body. 2) settings.sendAs.get the same address. Expect the two signature strings to be identical and to contain neither onclick nor script. 3) On a Workspace account whose admin has disabled name changes, patch displayName; compare the response's displayName with a following get. 4) settings.updateVacation with responseBodyHtml containing a script tag; compare the response with getVacation."

[[unknown]]
id = "identities-read-after-write"
question = "Does a settings read made right after a settings write always return the written state?"
assumed = "Yes. The generation fence only stops a reading claimed before a local write; a reading claimed after it is trusted."
if_wrong = "A refresh just after a write could put the old value back until the next refresh. Add a hold-off: readings of a kind are skipped for 60 s after a local write of it (compare fetched time with the write time in the pure rule)."
test = "Loop 50 times, alternating two signatures: settings.sendAs.patch the primary address, then at once settings.sendAs.get and settings.sendAs.list. Every get and list must show the signature just written. Repeat with updateVacation/getVacation and filters.create/filters.list. Run together with drafts-list-consistent and label-edit-list-consistency (the same loop: write, then read at once; a different endpoint each, so a separate answer each)."

[[unknown]]
id = "identities-from-outside-the-identities"
question = "What does Gmail do with a message sent through the API (messages.send, drafts.send) whose From is not an accepted send-as address of the account?"
assumed = "It sends the message with From replaced by the account's primary address; it neither refuses the call nor sends the header as given. So mailtide need not enforce From for safety (no spoofing is possible), and check_sender exists to stop a surprise, not an abuse."
if_wrong = "If Gmail sends the header as given, a stale or skipped check lets a host send as an address it does not own: make `send` and `drafts` call check_sender(fresh=true) themselves before drafts.send and messages.send and refuse on failure. If Gmail refuses with 400, nothing changes but the error a host sees."
test = "As a normal user token with gmail.send: 1) settings.sendAs.list to record the identities. 2) messages.send a raw message to the same account with 'From: Not Mine <someone@example.net>'. Record the status code. 3) If 200, messages.get?format=metadata&metadataHeaders=From on the returned id and on the received copy; record From, and look for X-Google-Original-From. 4) Repeat with a From that is a pending (unverified) alias. 5) Repeat steps 2 to 4 through drafts.create plus drafts.send."
status = "confirmed"
result = "2026-11-20 (account with one identity, the primary): a message with `From: Not Mine <someone@example.net>` was accepted (200) by messages.send (3 of 3) and by drafts.create plus drafts.send (2 of 2) and stored in SENT with From replaced by the account's primary address and its display name; no X-Google-Original-From or Sender header was added. The same replacement for a non-existent address in the account's own domain, and for a message with no From header. Kept as written: the primary address with another display name, and a plus-address of the primary (`denis+alias@...`, which is not a sendAs entry). Not run: a pending (unverified) alias, as the account has none. The recipient's copy was the same stored message (mail to self)."

[[unknown]]
id = "identities-signature-not-added-by-the-api"
question = "Does Gmail append the alias's signature to a message sent through messages.send or drafts.send?"
assumed = "No: the signature setting only feeds Gmail's own composers. The host (or compose-mime) places Identity.html_signature in the body it builds."
if_wrong = "Messages would carry the signature twice. Then the signature must not be placed by the composer for API sends, and Identity.html_signature becomes display-only."
test = "1) settings.sendAs.patch the primary address with signature '<div>SIG-MARKER-123</div>'. 2) messages.send a text/plain message and a multipart/alternative message without that marker. 3) drafts.create plus drafts.send a third. 4) messages.get?format=raw each sent message. Expect SIG-MARKER-123 in none of them."

[[unknown]]
id = "identities-status-of-primary-and-domain-aliases"
question = "Which sendAs entries come without verificationStatus, and do addresses that need no verification (the primary, a Workspace alias the admin assigned, a domain alias) come as `accepted`?"
assumed = "The primary may come without a status and is always sendable; every other entry that Gmail lets the user send from carries `accepted`. Any other or missing status on a non-primary entry is not sendable."
if_wrong = "Fails closed: a usable alias without a status would be refused by check_sender, never a pending one accepted. Fix by treating a missing status as accepted when treatAsAlias is true or the address is in the account's domain, once the real shape is known."
test = "On a Workspace test user with (a) an admin-assigned email alias, (b) a domain alias, (c) an external address verified by mail, (d) an external address still pending: settings.sendAs.list and record, per entry, isPrimary, isDefault, treatAsAlias and verificationStatus (present or absent, and its value). Do the same on a consumer gmail.com account with one verified external alias."

[[unknown]]
id = "identities-non-primary-update-refusal"
question = "How does Gmail answer sendAs.patch on a non-primary alias from an ordinary user token (the docs say only service accounts with domain-wide authority may), and a settings write without gmail.settings.basic?"
assumed = "HTTP 403 in both cases (reason forbidden or insufficientPermissions), mapped to SettingsError::Forbidden."
if_wrong = "Only the error class changes: a 400 becomes Invalid. Either way it is the caller's error, nothing is recorded and the account is not blocked, because settings calls never block."
test = "1) With a user OAuth token holding gmail.settings.basic: settings.sendAs.patch a verified non-primary alias with a new signature; record status, error.status and error.errors[].reason. 2) With a token holding only gmail.modify: settings.sendAs.patch the primary address, settings.updateVacation and settings.filters.create; record the same fields. 3) With a domain-wide-delegation token holding gmail.settings.basic: repeat step 1 and expect 200."

[[unknown]]
id = "identities-duplicate-filter"
question = "What does filters.create answer when a filter with the same criteria and action already exists?"
assumed = "400 ('Filter already exists'); no second filter is created."
if_wrong = "Safe as designed: create_filter looks for an equal filter in a fresh listing before retrying after an unknown outcome, so mailtide never creates the duplicate itself. If Gmail does create duplicates, a host calling create twice on purpose gets two filters, both visible and deletable."
test = "1) settings.filters.create { criteria: { from: 'dup-test@example.com' }, action: { addLabelIds: ['STARRED'] } }; note the id. 2) Send the identical request again; record status and error message. 3) settings.filters.list and count the filters with that criteria. 4) Delete what was created."
