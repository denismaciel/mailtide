id = "identities"
title = "Identities and the settings mirror: send-as aliases, signatures, vacation responder, filters, forwarding"
summary = "Mirror four small account settings (send-as identities with their signatures, the vacation responder, filters, forwarding) into the store with a slow refresh job, an on-demand refresh and a feed entry when one changes; then make identity fields, the vacation responder and filters writable as synchronous calls. Reads need no scope beyond what a sync already holds."
roadmap = ["C4", "A1"]
status = "approved"
design = "docs/features/identities.md"
# No hard dependency. Shared groundwork, added by whichever plan lands first:
#   an account-level job kind (also `drafts`: RefreshDrafts), the PUT, PATCH
#   and DELETE methods (also drafts, label-edit, purge, send), the unfenced
#   driver-call pattern and the QuotaDeferred exception (also drafts,
#   label-edit, purge, search). The refresh schedule follows the label refresh
#   `main` has (SPEC §6.6). A host calls `check_sender` before it
#   saves or sends, and places `Identity.html_signature` in the body itself
#   (`compose-mime` adds no signature).
depends_on = []

