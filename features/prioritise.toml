[[file]]
path = "crates/mailtide/src/jobs.rs"
change = "modify"
role = "The pure rule `prioritise(job, now)`, the `Prioritised` outcome, PRIORITISE_MAX_IDS and FOREGROUND_IMPORT_CAP"

[[file]]
path = "crates/mailtide/src/mirror.rs"
change = "modify"
role = "AccountMirror::prioritise: sort each id into queued, imported, unknown, blocked or over_limit and raise the jobs it may"

