test = "a_forward_plan_carries_files_and_inline_parts_with_their_content_ids"
note = "Inline parts are carried as parts with their Content-ID; Zero's rewrite to data: URLs is its editor's."

[[suite.test]]
name = "server-built forward content > refuses a forward with an unresolved inline image"
na = "Zero rewrites the HTML's cid: links and refuses when one has no part. mailtide never reads or rewrites the host's HTML; the plan lists the inline parts the original has"

[[suite.test]]
name = "server-built forward content > versions the actual original body and attachment bytes, not provider attachment IDs"
na = "A content hash for Zero's approval step. A Gmail message's content never changes under its id (SPEC §5.1), so the message id is the version"

