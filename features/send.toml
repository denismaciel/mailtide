# ------------------------------------------------------------------- unknowns
# Gmail behaviour the design assumes without proof. Paths are relative to
# https://gmail.googleapis.com/gmail/v1/users/me unless a full URL is given; run
# them on two test mailboxes A (the sender) and B. `drafts-message-id-kept`,
# `drafts-send-twice`, `drafts-raw-json-limit` and `drafts-history-on-send` (in
# drafts.toml) cover the same facts for the drafts calls and are not repeated.

[[unknown]]
id = "send-message-id-kept"
question = "Does Gmail keep a client-supplied Message-ID header through messages.send, on the metadata URI and on a resumable upload?"
assumed = "Yes: the SENT message and the recipient's copy carry the header exactly as supplied, and rfc822msgid: finds it."
if_wrong = "Safe: a lost answer can then never be matched, so it ends `unconfirmed` and nothing is resent. To get confirmation back, raw submissions would go through a draft (drafts.create then drafts.send, confirmed by the draft's disappearance) or be matched by a private header, which step 4 measures."
test = "1) As A, POST /messages/send {raw} to B with `Message-ID: <mailtide-probe-1@example.com>` and `X-Mailtide-Probe: 1`; note id M. 2) GET /messages/M?format=raw; decode; record both headers. 3) GET /messages?q=rfc822msgid:mailtide-probe-1@example.com&labelIds=SENT; expect M. 4) As B, find the message and GET it format=raw; record both headers. 5) Repeat 1-4 with the same message sent through the resumable upload (uploadType=resumable, Content-Type message/rfc822). 6) Repeat 1-3 with a Message-ID on A's own domain, with one on gmail.com, and with a send-as alias in From. Run together with drafts-message-id-kept and compose-mime-date-kept (one set of probe messages, sent both ways)."
status = "refuted"
result = "2026-11-20: messages.send replaces the client Message-ID. 10 of 10 sends (metadata URI x8, resumable upload x2; ids on example.com x7, on the account's own domain, on gmail.com, and one shaped like Gmail's own @mail.gmail.com) were stored in SENT with `Message-Id: <CA+...@mail.gmail.com>` chosen by Gmail; the supplied id appeared nowhere in the stored headers and q=rfc822msgid:<supplied id> (with labelIds=SENT, and with includeSpamTrash=true) listed nothing for 40 s. The header name is rewritten to `Message-Id`. Other client headers were kept byte for byte through the same sends: X-Mailtide-Probe, References, In-Reply-To, Reply-To, Sender, User-Agent, Return-Path, any X- header (10 of 10 tried); Date is rewritten (see compose-mime-date-kept). The recipient's copy was read only for mail to the account itself, where the SENT message is the delivered message (one id, labels SENT and INBOX). So a lost answer cannot be matched by Message-ID; a private header does survive but q cannot search it (history.list from the pre-send historyId plus messages.get format=metadata&metadataHeaders=<private header> on new SENT messages finds it). messages.insert, by contrast, keeps Message-ID and Date as written. Not run: a send-as alias in From (the account has none). if_wrong applies."

[[unknown]]
id = "send-lookup-latency"
question = "How soon after messages.send answers 200 does messages.list with q=rfc822msgid:<id> and labelIds=SENT return the message, and can it stay absent?"
assumed = "Within send_confirm_delay (15 s) nearly always, and always well inside send_confirm_window (10 min)."
if_wrong = "Safe: a message Gmail did send would be reported `unconfirmed` (maybe sent) and flip to `sent` when the sync imports it; mailtide itself never resends. The window and the lookup times must then grow to the measured latency."
test = "As A, send 100 messages to B, each with a unique Message-ID. For each, starting when the 200 arrives, GET /messages?q=rfc822msgid:<id>&labelIds=SENT&maxResults=5 at 0, 1, 2, 5, 10, 15, 30, 60 and 300 s; record the first time it lists the id. Report the maximum and any message never listed. Also record when GET /history from the profile's historyId taken before the send first shows the messagesAdded record. Run together with search-index-lag (both poll messages.list with q after a change that history already shows)."

[[unknown]]
id = "send-late-apply"
question = "Can Gmail deliver a messages.send request after the client has given up on it, and how long after?"
assumed = "It can, but within seconds: a request that reached Gmail is applied or dropped well inside send_confirm_window (10 min)."
if_wrong = "Safe for mailtide: a message that appears later than the window still turns `unconfirmed` into `sent`. The exposure is a host that called resend_submission in between: both copies carry the same Message-ID. If late delivery is observed past a few minutes, lengthen the window and say so on resend."
test = "As A, 200 times: open a connection, write a complete POST /messages/send request to B with a unique Message-ID and Subject, and close the socket without reading (also: abort after 50 ms, 200 ms, 1 s). For each, poll GET /messages?q=rfc822msgid:<id> every 5 s for 15 min. Record how many were sent and the longest delay between the abort and the message first being listed."

[[unknown]]
id = "send-bcc-stripped"
question = "Does Gmail deliver to Bcc recipients while removing the Bcc header from the copies of To and Cc recipients, through messages.send and through drafts.send, and do the sender's SENT copy and a stored draft keep the header?"
assumed = "Yes to all: the copies of To and Cc carry no Bcc; the SENT copy and a stored draft keep the header in format=raw. Both pinned Gmail clients send their Bcc this way, but neither tests it."
if_wrong = "Not safe to ship as designed: Bcc recipients would be disclosed. mailtide never rewrites bytes and Gmail takes its envelope from the headers, so admission would have to refuse any message with a Bcc header until another route exists. Settle this before the first slice that sends. If only the SENT copy or the stored draft loses the header, nothing is disclosed: message-facts' `bcc` fact is then empty for sent mail, and a host must keep a draft's Bcc beside the draft (compose-mime)."
test = "As A, POST /messages/send {raw} with To: B, Bcc: C (a third mailbox), unique Subject. 1) As B, GET the message format=raw; expect no Bcc header and C named nowhere. 2) As C, expect the message delivered; record whether its copy has a Bcc header. 3) As A, GET the SENT message format=raw; record whether Bcc is kept. 4) Repeat through the resumable upload, and with Bcc folded over two lines. 5) As A, send the same from Gmail's web UI and repeat step 3 on its SENT copy. 6) As A, POST /drafts with the same raw; GET /drafts/D?format=raw and record whether Bcc is kept; POST /drafts/send {id:D}; repeat steps 1 to 3. This is the one unknown for Bcc: compose-mime and message-facts rely on it. Run together with blob-dedupe-raw-differs-per-mailbox and blob-dedupe-body-identical (the same sends, the same copies read back raw)."

[[unknown]]
id = "send-thread-mismatch"
question = "What does messages.send do when threadId is given but the Subject differs from the thread's, or References and In-Reply-To do not name a message of it?"
assumed = "It answers 200 and returns the thread it actually used (the requested one or a new one); it does not refuse."
if_wrong = "Safe either way: a 4xx becomes `refused` with Gmail's message and nothing is sent; a 200 is recorded with the threadId Gmail answers, never the one requested. If Gmail refuses a changed Subject, hosts must drop thread_of when the user edits the subject."
test = "Pick an INBOX message of A with thread T, Message-ID X, Subject S. As A send to B, each with threadId T: a) Subject `Re: S`, In-Reply-To and References X (control; expect threadId T); b) the same with Subject `Something else`; c) Subject `Re: S` and no In-Reply-To or References; d) Subject `Fwd: S`, References X, no In-Reply-To (a forward); e) Subject `Re: S` with In-Reply-To naming a message of another thread. Record each status, the answered threadId, and GET /threads/T?format=minimal afterwards. As B, record how each arrives threaded."

[[unknown]]
id = "send-thread-gone"
question = "What does messages.send answer for a threadId that does not exist any more (every message of it permanently deleted)?"
assumed = "An error (404 or 400) and nothing is sent."
if_wrong = "Safe: if Gmail sends it in a new thread instead, the answer's threadId is what is recorded. Either answer leaves one message or none; the row is `refused{thread_not_found}` or `sent`."
test = "As A: send a message to A, note its thread T; DELETE /messages/{id} for every message of T; GET /threads/T expects 404. Then POST /messages/send {raw to B, threadId: T}; record status, error body, and whether B received anything. Repeat with a threadId that never existed (16 hex digits)."

[[unknown]]
id = "send-session-completed-status"
question = "After a resumable upload to messages.send has completed, does a status query (empty PUT, Content-Range: bytes */N) on its session answer 200 or 201 with the sent Message, without sending again?"
assumed = "Yes. Google's upload guide says a completed session may answer 200 or 201 to a status query; that the body is the Message and that the query has no side effect is inferred."
if_wrong = "Safe: an empty body is `sent, id unknown` and the id is then found by Message-ID; a 404 or 410 goes to Message-ID confirmation. Only a query that sent the message again would break at-most-once, and then the status query must never be issued after the final chunk (confirm by Message-ID instead)."
test = "As A: 1) POST https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=resumable with X-Upload-Content-Type: message/rfc822 and X-Upload-Content-Length: N; note the Location URI. 2) PUT all N bytes (a message to B with a unique Message-ID); note the answer. 3) PUT the same URI with no body and Content-Range: bytes */N; record status, headers and body. 4) Repeat step 3 after 1 min, 1 h, 1 day and 8 days. 5) GET /messages?q=rfc822msgid:<id>&labelIds=SENT; expect exactly one. As B, expect exactly one copy. 6) Repeat steps 1-3 but close the socket on step 2 after the last byte without reading the answer."

[[unknown]]
id = "send-session-thread"
question = "Does a resumable upload to messages.send honour a threadId given as JSON metadata in the session's initiating request?"
assumed = "Yes: the initiating POST with Content-Type: application/json and body {\"threadId\": T} threads the uploaded message/rfc822 into T."
if_wrong = "Safe but wrong for the user: a large reply would start a new thread. It is visible at once (the answered threadId differs and is what we record). Large replies would then use uploadType=multipart, which carries the metadata in the same request and loses resumability."
test = "Using thread T, Message-ID X and Subject S of an INBOX message of A: 1) start a resumable session with body {\"threadId\": T}; upload a 6 MiB reply to B (Subject `Re: S`, In-Reply-To and References X); record the answered threadId. 2) Repeat with uploadType=multipart (multipart/related: a JSON part {\"threadId\": T}, then a message/rfc822 part). 3) Repeat step 1 without the metadata body as a control. GET /threads/T?format=minimal after each."

[[unknown]]
id = "send-size-limit"
question = "What is the largest RFC 5322 message messages.send accepts on the upload URI, and how does it refuse a larger one?"
assumed = "35 MB of raw bytes (the figure older reference pages gave for this method; today's state none), refused with 413 or 400 and nothing sent. send_max_size defaults to 35,000,000 bytes."
if_wrong = "Safe: a lower limit is Gmail's refusal, recorded as `refused{too_large}` with nothing sent, and the default is lowered to the measured size. A refusal that arrives only after the whole upload wastes bandwidth, not correctness."
test = "As A, for sizes 20, 25, 30, 34, 35, 36 and 40 MiB (one attachment padding the message, To: A, unique Message-ID): start a resumable session, upload in 8 MiB chunks, record the status and error body of the initiating request and of every chunk, and whether the message is in SENT afterwards. Repeat the largest accepted size to an external recipient B and record whether delivery is refused later (a bounce in A's inbox). Run together with drafts-raw-json-limit and drafts-upload-limit (one ladder of padded messages)."

[[unknown]]
id = "send-upload-quota"
question = "How many quota units does a resumable messages.send cost: 100 once, or per request of the session?"
assumed = "100 units once per session; chunk and status requests are free. The ledger charges 100 on StartUpload and 0 on Upload and UploadStatus."
if_wrong = "Safe: if chunks are charged, the ledger under-counts and Gmail answers 429, which is an account cooldown and a retry on the same session. Declare the measured per-request cost."
test = "In a Cloud project used for nothing else: read the Gmail API `Queries per minute per user` usage in the Cloud Console quota metrics; send one 30 MiB message to self in 8 MiB chunks with one extra status query; wait for the metric to update and record the units added. Repeat with one JSON messages.send of 100 KiB as the 100-unit control, and with a session that is started and abandoned."

[[unknown]]
id = "send-history-on-send"
question = "Does a message sent with messages.send appear in history.list as messagesAdded with the SENT label, by the time the send answers?"
assumed = "Yes; a history pass run right after the 200 discovers it."
if_wrong = "Nothing is lost, only late: SubmissionChanged{sent} already carries the message id, and the message row would arrive with a later pass or reconciliation. The fix is to enqueue a Verify job for the answered id (one messages.get, 20 units) in the commit that records the send."
test = "As A: GET /profile; note H. POST /messages/send to B; on the 200 note M and at once GET /history?startHistoryId=H (all pages, no filter); record whether a messagesAdded for M with labelIds containing SENT is present; if not, poll every second and record the delay. Repeat 50 times, and with a message to A itself (expect one message with SENT and INBOX, or record what arrives). Run together with drafts-history-on-send and drafts-history-on-save (one history window read after each call)."
