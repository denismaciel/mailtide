# --------------------------------------------------------------------- sources

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/send"
note = "Read 2026-11-20. Metadata URI sends to the recipients in To, Cc and Bcc and answers with a Message."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/sending"
note = "Read 2026-11-20. messages.send or drafts.send; RFC 2822 bytes as base64url in `raw`. Says nothing about Message-ID, From rewriting, Bcc or limits."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/threads"
note = "Read 2026-11-20. A message joins a thread when threadId is given, References and In-Reply-To follow RFC 2822 and the Subject headers match. Does not say what happens otherwise."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20. messages.send and drafts.send each cost 100 units. A history.list page costs 2."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/handle-errors"
note = "Read 2026-11-20. Gmail can answer 429 with a retry time and a 200 acknowledges acceptance. mailtide keeps one wire request per submission even for a rate limit or a backend error."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc8621#section-7"
note = "JMAP EmailSubmission: sendAt, undoStatus (pending, final, canceled), cannotUnsend, onSuccessUpdateEmail. The vocabulary of our Submission."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc5322#section-3.6.4"
note = "Message-ID, In-Reply-To and References: how a reply names its parent and how the chain is built."

