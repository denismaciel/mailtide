# ------------------------------------------------------------------- unknowns
# Recorded Gmail evidence. Upload probes are historical. Production uses JSON raw.
# Draft-specific probes and the JSON size ladder also appear in drafts.toml.
# Retired unmeasured probe: send-upload-quota only applied to resumable sends.

[[unknown]]
id = "send-message-id-kept"
question = "Does Gmail keep a client-supplied Message-ID header through messages.send, on the metadata URI and on a resumable upload?"
assumed = "Historical assumption: Gmail keeps the supplied Message-ID in the SENT message and recipient copy, and the supplied id is searchable."
if_wrong = "Use the surviving private X-Mailtide-Id token from the normal SENT import. A send without a matching import by the deadline is unknown and is never resent."
test = "1) As A, POST /messages/send {raw} to B with `Message-ID: <mailtide-probe-1@example.com>` and `X-Mailtide-Probe: 1`; note id M. 2) GET /messages/M?format=raw; decode; record both headers. 3) GET /messages?q=rfc822msgid:mailtide-probe-1@example.com&labelIds=SENT; expect M. 4) As B, find the message and GET it format=raw; record both headers. 5) Repeat 1-4 with the same message sent through the resumable upload (uploadType=resumable, Content-Type message/rfc822). 6) Repeat 1-3 with a Message-ID on A's own domain, with one on gmail.com, and with a send-as alias in From. Run together with drafts-message-id-kept and compose-mime-date-kept (one set of probe messages, sent both ways)."
status = "refuted"
result = "2026-11-20: messages.send replaces the client Message-ID. 10 of 10 sends (metadata URI x8, resumable upload x2; ids on example.com x7, on the account's own domain, on gmail.com, and one shaped like Gmail's own @mail.gmail.com) were stored in SENT with `Message-Id: <CA+...@mail.gmail.com>` chosen by Gmail; the supplied id appeared nowhere in the stored headers and q=rfc822msgid:<supplied id> (with labelIds=SENT, and with includeSpamTrash=true) listed nothing for 40 s. The header name is rewritten to `Message-Id`. Other client headers were kept byte for byte through the same sends: X-Mailtide-Probe, References, In-Reply-To, Reply-To, Sender, User-Agent, Return-Path, any X- header (10 of 10 tried); Date is rewritten (see compose-mime-date-kept). The recipient's copy was read only for mail to the account itself, where the SENT message is the delivered message (one id, labels SENT and INBOX). So a lost answer cannot be matched by Message-ID; a private header does survive but q cannot search it (history.list from the pre-send historyId plus messages.get format=metadata&metadataHeaders=<private header> on new SENT messages finds it). messages.insert, by contrast, keeps Message-ID and Date as written. Not run: a send-as alias in From (the account has none). The send design uses X-Mailtide-Id and ordinary sync import for confirmation."

[[unknown]]
id = "send-lookup-latency"
question = "How soon after messages.send answers 200 does messages.list with q=rfc822msgid:<id> and labelIds=SENT return the message, and can it stay absent?"
assumed = "Historical assumption: the client-supplied Message-ID appears in the search index within 15 seconds in most cases."
if_wrong = "Confirm with the imported SENT message's X-Mailtide-Id token. No Message-ID lookup is part of send admission, threading or recovery."
test = "As A, send 100 messages to B, each with a unique Message-ID. For each, starting when the 200 arrives, GET /messages?q=rfc822msgid:<id>&labelIds=SENT&maxResults=5 at 0, 1, 2, 5, 10, 15, 30, 60 and 300 s; record the first time it lists the id. Report the maximum and any message never listed. Also record when GET /history from the profile's historyId taken before the send first shows the messagesAdded record. Run together with search-index-lag (both poll messages.list with q after a change that history already shows)."
status = "refuted"
result = "2026-11-20: the lookup as designed never finds the message, because Gmail replaces the client Message-ID on send (send-message-id-kept): q=rfc822msgid:<client id> with labelIds=SENT listed nothing for 10 of 10 sent messages, polled for 40 s each. The index itself is fast: for 100 sends, q=rfc822msgid:<the id Gmail assigned, read back with messages.get> with labelIds=SENT, and q=subject:<unique token> with labelIds=SENT, both listed the message on the first poll, made 0.38 to 0.9 s after the 200 (median 0.46 s; a few first polls were delayed to 8.8 s by this run's pacing and also found it); none was ever absent, and history.list showed the messagesAdded record on the first read each time. Send uses the token visible on an ordinary SENT import."

[[unknown]]
id = "send-late-apply"
question = "Can Gmail deliver a messages.send request after the client has given up on it, and how long after?"
assumed = "Gmail can apply a fully transmitted send after the client abandons its response, usually within seconds."
if_wrong = "The raw confirmation deadline reports unknown without releasing the send fence. A matching SENT import can still settle it later."
test = "As A, make 200 JSON messages.send requests to self with unique Subject and private-header tokens. Close the socket without reading the answer, at once or after 50 ms, 200 ms or 1 s. Use history.list from the pre-send cursor and the unique Subject for the historical measurement. Compare the sent message internalDate with the close time and observe history for 15 minutes after the last request."
status = "confirmed"
result = "2026-11-20: 200 complete POST /messages/send requests (to self, unique Subject token and private header) were written to a TLS socket that was then closed without reading a byte: 50 closed at once, 50 after 50 ms, 50 after 200 ms, 50 after 1 s. All 200 were sent, exactly one message each (none dropped, none doubled; each found in history.list and by Subject, labels [UNREAD, SENT, INBOX]). Gmail's internalDate for each (1 s resolution) was between 1.8 s before and 0.23 s after the moment of the close, so every request was applied within about a second of the abort. History and Subject search were then watched for 15 minutes after the last abort: nothing further appeared. So an abandoned request that reached Gmail is applied, promptly; no late delivery was seen. (Not covered: a request cut off before its last byte.)"

[[unknown]]
id = "send-bcc-stripped"
question = "Does Gmail deliver to Bcc recipients while removing the Bcc header from the copies of To and Cc recipients, through messages.send and through drafts.send, and do the sender's SENT copy and a stored draft keep the header?"
assumed = "Yes to all: the copies of To and Cc carry no Bcc; the SENT copy and a stored draft keep the header in format=raw. Both pinned Gmail clients send their Bcc this way, but neither tests it."
if_wrong = "If a future regression discloses Bcc to recipients, refuse Bcc submissions until Gmail's behaviour is safe again. If only the sender's copy loses the header, its imported bcc fact is empty."
test = "Send JSON raw as A to B with Bcc to C, a unique Subject and a private header token. Read recipient copies as raw for Bcc and the sender's SENT copy for the retained header. Repeat with folded and Bcc-only variants, and through a stored draft and drafts.send; read the saved draft as raw too."
status = "confirmed"
result = "2026-11-20: five messages sent To an outside mailbox with Bcc to a plus-address of the sender (messages.send with JSON raw x3, drafts.create then drafts.send x2). Each recipient copy, read as the original message in the recipient's mailbox, had no Bcc header and did not contain the Bcc address anywhere, 5 of 5; the private X- header was kept and Message-ID and Date were the ones Gmail assigned. The sender's SENT copy keeps the Bcc header (format=raw), also for a stored draft, a folded Bcc and a Bcc-only message. Each Bcc recipient was delivered. Not run: a resumable upload to an outside recipient (the upload path is not used), a send-as alias, and a message sent from the web UI."

[[unknown]]
id = "send-thread-mismatch"
question = "What does messages.send do when threadId is given but the Subject differs from the thread's, or References and In-Reply-To do not name a message of it?"
assumed = "It answers 200 and returns the thread it actually used (the requested one or a new one); it does not refuse."
if_wrong = "Surface a definitive refusal with its reason, or settle on the thread id seen in the imported SENT message. Keep the bytes as the host supplied them."
test = "Pick an INBOX message of A with thread T, Message-ID X, Subject S. As A send to B, each with threadId T: a) Subject `Re: S`, In-Reply-To and References X (control; expect threadId T); b) the same with Subject `Something else`; c) Subject `Re: S` and no In-Reply-To or References; d) Subject `Fwd: S`, References X, no In-Reply-To (a forward); e) Subject `Re: S` with In-Reply-To naming a message of another thread. Record each status, the answered threadId, and GET /threads/T?format=minimal afterwards. As B, record how each arrives threaded."
status = "confirmed"
result = "2026-11-20, 3 seed threads T, 6 sends each with threadId T, all answered 200 with threadId T and were listed by threads.get(T): a) `Re: S` with In-Reply-To and References naming the seed; b) the same headers with an unrelated Subject; c) `Re: S` with no In-Reply-To or References; d) `Fwd: S` with References only; e) `Re: S` with In-Reply-To and References naming a message of another thread (it went to T, not to that thread); f) unrelated Subject and no reference headers. 18 of 18: the requested thread is always used, no refusal. The reverse also holds: the same messages a), b), c) sent without threadId each started a new thread (9 of 9), so through the API the thread is decided by threadId alone, not by Subject or References. Recipient-side threading was not observable (sender and recipient were the same mailbox)."

[[unknown]]
id = "send-thread-gone"
question = "What does messages.send answer for a threadId that does not exist any more (every message of it permanently deleted)?"
assumed = "An error (404 or 400) and nothing is sent."
if_wrong = "If Gmail uses a different thread instead, normal import supplies its actual id. A definitive 404 is a refused submission."
test = "As A: send a message to A, note its thread T; DELETE /messages/{id} for every message of T; GET /threads/T expects 404. Then POST /messages/send {raw to B, threadId: T}; record status, error body, and whether B received anything. Repeat with a threadId that never existed (16 hex digits)."
status = "confirmed"
result = "2026-11-20: messages.send with a threadId that no longer exists answered HTTP 404, error.status NOT_FOUND, reason notFound, message \"Requested entity was not found.\", and nothing was sent (no message with the Subject token anywhere 6 s later), 3 of 3. The thread was made to disappear by the route this run's scopes allow: a thread whose only message was a draft, removed for good with drafts.delete (threads.get 200 before, 404 after); deleting a sent message with messages.delete was not possible. A well-formed thread id that never existed gave the same 404 (3 of 3); a malformed one, or 16 hex digits with the top bit set, gave 400 INVALID_ARGUMENT \"Invalid thread_id value\". drafts.create with a gone or never-existing threadId answers the same 404, and a resumable send whose metadata names one answers 404 on its final request."

[[unknown]]
id = "send-session-completed-status"
question = "After a resumable upload to messages.send has completed, does a status query (empty PUT, Content-Range: bytes */N) on its session answer 200 or 201 with the sent Message, without sending again?"
assumed = "Historical assumption: the status query immediately reveals the completed send without causing another delivery."
if_wrong = "Use one JSON raw request. Do not base recovery on resumable sessions or re-upload on a 308."
test = "Historical probe: start a resumable send, PUT the message with a unique Subject or private header, then query status with an empty PUT and Content-Range bytes */N. Repeat when the connection closes immediately after the final byte. Observe history and count SENT copies, including when the 308 causes a repeat of the final bytes."
status = "refuted"
result = "2026-11-20. Once the session has completed, the assumption holds: a status query (empty PUT, Content-Range: bytes */N) answered 200 with the Message (keys id, threadId, labelIds; the id of the sent message) right after the upload, 2 s later and 60 minutes later, on 3 sessions, and sent nothing again (one message per session); a second full PUT on a completed session also just returns that Message. The body is the stored first answer (it still showed INBOX after the message had been trashed). What breaks the design is the time before completion: when the final bytes were written and the socket closed unread, a status query 0.2 s later answered 308 with no Range header, exactly as if nothing had arrived; it kept answering 308 for 0.5 to 0.7 s for a 3 kB message and 6.4 to 7.5 s for a 2 MB one (10 sessions), then 200. Uploading the body again on that 308, as the resumable protocol says to, sent a second message: 3 of 3 sessions ended with two SENT messages (different ids and Message-Ids) for one submission. The same in a two-chunk session: after the unread final chunk the status query answered 308 with Range covering only the first chunk, and re-sending the final chunk as told ended with two SENT messages (3 of 3). So after a final chunk whose answer was lost, a 308 must not be followed by a re-upload until the session has been polled for long enough (seconds, growing with size), or the send must be confirmed another way. Not run: status queries after 1 day and 8 days. These measurements rule out resumable uploads in mailtide's send design."

[[unknown]]
id = "send-session-thread"
question = "Does a resumable upload to messages.send honour a threadId given as JSON metadata in the session's initiating request?"
assumed = "Historical assumption: the upload's JSON metadata supplies the thread id."
if_wrong = "No change to production: it uses the JSON raw endpoint with the threadId in the same request."
test = "Using thread T, Message-ID X and Subject S of an INBOX message of A: 1) start a resumable session with body {\"threadId\": T}; upload a 6 MiB reply to B (Subject `Re: S`, In-Reply-To and References X); record the answered threadId. 2) Repeat with uploadType=multipart (multipart/related: a JSON part {\"threadId\": T}, then a message/rfc822 part). 3) Repeat step 1 without the metadata body as a control. GET /threads/T?format=minimal after each."
status = "confirmed"
result = "2026-11-20: a resumable session started with Content-Type application/json and body {\"threadId\": T} threaded the uploaded message into T: a 6 MiB reply (answered threadId T, listed by threads.get), and 3 of 3 small messages with an unrelated Subject and no reference headers, so it is the metadata that decides, not the headers. uploadType=multipart (JSON part {\"threadId\": T} then message/rfc822) did the same (6 MiB reply and 3 of 3 small unrelated). Control: the same reply uploaded with no metadata body started a new thread (6 MiB x1, small x3), although it carried `Re:` Subject, In-Reply-To and References. A threadId that does not exist in the metadata: the session starts (200) and the upload's final request answers 404 NOT_FOUND, nothing sent."

[[unknown]]
id = "send-size-limit"
question = "What sizes does Gmail accept on the wire and actually deliver?"
assumed = "Historical assumption: the upload limit would be about 35 MB and Gmail would refuse excessive sizes with 413 or 400."
if_wrong = "Enforce max_message_bytes before staging or sending. Use the measured 34 MiB default on the JSON raw endpoint and report acceptance separately from delivery."
test = "Historical probe: as A, send padded RFC 5322 messages to self at 20, 25, 30, 34, 35, 36 and 40 MiB, plus sizes around the observed threshold. Record wire status and error, SENT import, and mailer-daemon notices. The original comparison used both the JSON route and resumable uploads in 8 MiB chunks; see drafts-raw-json-limit and drafts-upload-limit."
status = "refuted"
result = "2026-11-20, all to self: a size limit exists near 35 MiB but an oversize message is not always refused. Resumable upload in 8 MiB chunks: 20, 25, 30, 34 MiB (35,651,584 bytes) sent and delivered (200 on the final chunk, in SENT, no notice). 36 and 40 MiB: the initiating request answered 200, each chunk 308, and the final chunk HTTP 413 FAILED_PRECONDITION (reason failedPrecondition) \"Media is too large. Limit: 36700160\"; nothing in SENT. In between, Gmail answers 200 and then does not send: messages of 36,698,160, 36,700,060 and 36,700,160 raw bytes (resumable and JSON), and JSON `raw` sends of 36 and 40 MiB (the metadata URI has no 413 up to 40 MiB), were stored with the SENT label and each was followed within about 1 s by a message from mailer-daemon@googlemail.com in the same thread, Subject `Re: <subject>`, body `An error occurred. Your message was not sent.` (7 of 7; 0 of 15 sends of 1 to 34 MiB). So the real limit lies between 35,651,584 and 36,698,160 raw bytes, the refusal above it can be a 200 plus a bounce, and a 413 arrives only after the whole upload. HTTP 200 was evidence of acceptance only. Not run: an external recipient (not allowed in this run). The chosen limit is max_message_bytes = 35,651,584 (34 MiB) by default; production has no upload path."

[[unknown]]
id = "send-history-on-send"
question = "Does a message sent with messages.send appear in history.list as messagesAdded with the SENT label, by the time the send answers?"
assumed = "Yes; a history pass run right after the 200 discovers it."
if_wrong = "A delayed history record settles when normal incremental sync or reconciliation imports the message. If that misses the reporting deadline, the outcome is unknown until an import confirms it."
test = "As A: GET /profile; note H. POST /messages/send to B; on the 200 note M and at once GET /history?startHistoryId=H (all pages, no filter); record whether a messagesAdded for M with labelIds containing SENT is present; if not, poll every second and record the delay. Repeat 50 times, and with a message to A itself (expect one message with SENT and INBOX, or record what arrives). Run together with drafts-history-on-send and drafts-history-on-save (one history window read after each call)."
status = "confirmed"
result = "2026-11-20, 100 messages.send calls (50 to a plus-address of the account, 50 to the account's own address): history.list from the historyId read before the send, read right after the 200 (the read started 3 to 260 ms after the answer in 92 cases; in 8 it was held back up to 8.4 s by this run's own pacing), held a messagesAdded record for the answered id with labelIds [UNREAD, SENT, INBOX] on the first read, 100 of 100; none needed a second read. Mail to oneself is one message carrying SENT and INBOX (and UNREAD), also when addressed to a plus-address. One exception in the whole run (1 of about 480 sends to self): for a reply sent without threadId, Gmail also stored a separate delivered copy (its own id, the same Message-ID, labels INBOX and UNREAD, full delivery headers) in the thread its References named, while the SENT copy sat in a new thread; so one send to self can be two messages. Not observed: a send to another mailbox (not allowed in this run); only the INBOX/UNREAD labels would differ."
