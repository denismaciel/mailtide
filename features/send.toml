test = "a_forward_plan_strips_old_prefixes_and_never_lists_bcc"
note = "The subject and header half. The HTML body is returned untouched for the host to quote; mailtide builds no quote."

[[suite.test]]
name = "server-built forward content > fails closed on missing or empty original attachment data"
test = "a_forward_plan_with_an_unreadable_part_is_an_error"

[[suite.test]]
