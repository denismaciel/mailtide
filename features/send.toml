id = "send"
title = "Send: new, reply and forward, large uploads, at most once, undo and schedule"
summary = "A send is a durable submission (host key, staged bytes or a draft id, optional send-at) that a Foreground job delivers through messages.send or a resumable upload exactly once per claim, that Gmail confirms by Message-ID when the answer is lost, and that can be cancelled until the job claims it."
roadmap = ["C3", "C5"]
status = "approved"
design = "docs/features/send.md"
# drafts: a submission may name a draft (delivered by drafts' send routine) and
#   the import-time confirmation hook is shared.
# compose-mime: the reply, forward and quoting helpers are built in its crate
#   after it and reuse its Address and MessageId types; admission reads the
#   Message-ID with MessageId::parse.
# search: the lookup that confirms a lost answer, and the admission check that
#   a Message-ID fits in a query, are search's by_message_id().
# identities decides From and is not needed: the API takes RFC 5322 bytes.
depends_on = ["drafts", "compose-mime", "search"]

