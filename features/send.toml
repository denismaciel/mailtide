[[suite]]
impl = "zero"
path = "apps/server/src/lib/driver/imap.test.ts"
target = "crates/mailtide-io/tests/ref_zero_driver_imap.rs"

[[suite.test]]
name = "ImapMailManager > sends via SMTP without Bcc, files a Sent copy and threads the reply"
test = "a_reply_goes_out_once_with_its_bcc_lands_in_sent_and_joins_the_thread"
note = "By behaviour against the fake Gmail: one messages.send carrying the bytes as given (Bcc header included, Gmail removes it from recipient copies), the original's threadId, a SENT message mirrored in that thread. The SMTP envelope and the APPEND do not apply."

[[suite]]
