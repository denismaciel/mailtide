id = "send"
title = "Send: new, reply and forward, at most once, undo and schedule"
summary = "Raw bytes go through one durable JSON messages.send submission, cancellable until claim and confirmed by an imported X-Mailtide-Id. A saved draft uses drafts' own fenced send."
roadmap = ["C3", "C5"]
status = "in_progress"
design = "docs/features/send.md"
# drafts supplies the existing draft send, its account-level job shape and the
# import confirmation hook. compose-mime and message-facts supply the token
# reader, reply/forward types and imported tracking_id fact, respectively.
depends_on = ["drafts", "compose-mime", "message-facts"]

