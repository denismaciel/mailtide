# --------------------------------------------------------------------- sources

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/send"
note = "Read 2026-11-20. Metadata URI and upload URI; sends to the recipients in To, Cc and Bcc; the answer is a Message; scopes. States no size limit and no accepted media types."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/uploads"
note = "Read 2026-11-20. uploadType media, multipart, resumable; simple and multipart for 5 MB or less; the resumable session (X-Upload-Content-Type, X-Upload-Content-Length, Location), chunks in multiples of 256 KiB, the status query (empty PUT, Content-Range: */N), 308 with Range, 200 or 201 when the upload already completed, 404 for an expired session, 410 for a dead one, retry of 5xx with backoff. Session lifetime is given as one week in one place and about a day in another."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/sending"
note = "Read 2026-11-20. messages.send or drafts.send; RFC 2822 bytes as base64url in `raw`. Says nothing about Message-ID, From rewriting, Bcc or limits."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/threads"
note = "Read 2026-11-20. A message joins a thread when threadId is given, References and In-Reply-To follow RFC 2822 and the Subject headers match. Does not say what happens otherwise."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20. messages.send 100, drafts.send 100, messages.list 5; 500 recipients per message. Nothing on upload requests."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/handle-errors"
note = "Read 2026-11-20. 429 `User-rate limit exceeded (Mail sending)` carries a retry time and can last hours; 500 backendError is retried with backoff; a 200 does not mean the mail was delivered."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc8621#section-7"
note = "JMAP EmailSubmission: sendAt, undoStatus (pending, final, canceled), cannotUnsend, onSuccessUpdateEmail. The vocabulary of our Submission."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc5322#section-3.6.4"
note = "Message-ID, In-Reply-To and References: how a reply names its parent and how the chain is built."

