# ------------------------------------------- Gmail behaviour assumed, to test

[[unknown]]
id = "label-edit-delete-history"
question = "When a user label is deleted, does history.list emit a labelsRemoved record for every message that carried it, or do those messages just stop listing the id with no history record?"
assumed = "History emits one labelsRemoved record per message, as the simulator models. The design does not depend on it: the label is removed from every mirrored row on proof of the deletion (our own delete's answer, or a labels.list without the id), and the id is remembered as deleted for 30 days so no later observation can put it back."
if_wrong = "Nothing changes in the mirror's result: rows are already stripped by the definition rule, and a replayed labelsAdded or an in-flight fetch from before the deletion is filtered by the deleted-label memory, so no mirrored message keeps the id. What changes is timing for a deletion made elsewhere: messages lose the label at the next label refresh (at most 15 minutes) instead of with the history page. If that is too slow, a labelsRemoved-free deletion can be noticed sooner by refreshing labels whenever a fetched message lacks a label its row has."
test = "With a full-scope token: 1) labels.create {name: 'mt-probe-<random>'} and keep its id L. 2) messages.insert two small messages and messages.modify each with addLabelIds [L]. 3) getProfile and note historyId H. 4) labels.delete L. 5) history.list startHistoryId=H, following every page: record whether labelsRemoved records naming L appear for both messages, and their ids. 6) messages.get format=minimal on both: expect labelIds without L, and note whether each message's historyId is now greater than H. 7) Repeat steps 3 to 6 after 60 seconds to catch records that arrive late. 8) messages.delete both messages."

[[unknown]]
id = "label-edit-list-consistency"
question = "Does labels.list always reflect label creates and deletes that completed before the request, and never omit a label that exists?"
assumed = "Yes: one unpaginated answer that includes every existing label and no deleted one. A listing without a stored id is treated as proof that the label was deleted."
if_wrong = "A listing that wrongly omits a live label would strip it from mirrored rows and nothing would put it back until those messages are fetched again (drift reports them as differs). The safe variant is local to one pure rule: remove a label only when two listings a refresh apart both lack it (a `missing` flag on the stored definition, no engine change), at the cost of up to one more refresh interval."
test = "1) labels.create a probe label, then labels.list at once: expect the new id. Repeat 20 times with fresh names and count misses. 2) labels.delete each probe, then labels.list at once: expect the id gone; count the listings that still show it. 3) While creating 20 labels from one client in a loop, call labels.list from a second client 50 times: every listing must contain every label created before that request was sent and no label deleted before it. Run together with drafts-list-consistent and identities-read-after-write (the same loop: write, then list at once; a different endpoint each, so a separate answer each)."

[[unknown]]
id = "label-edit-duplicate-name"
question = "What does labels.create answer for a name another label already holds, is the comparison case-sensitive, and does labels.patch answer the same way when a rename hits a taken name?"
assumed = "HTTP 409 with the message `Label name exists or conflicts`, for create and for patch; names that differ only in case conflict."
if_wrong = "Any other 4xx is reported as Refused with Gmail's message and nothing is recorded, so the mirror stays right. Only the error type is less precise (no NameTaken with the existing label), and a host retrying a create after a timeout must list labels itself."
test = "1) labels.create {name: 'mt-dup'}; 2) labels.create {name: 'mt-dup'} again: record status and error body. 3) labels.create {name: 'MT-DUP'}: record whether it is refused. 4) labels.create {name: 'mt-dup2'} then labels.patch it with {name: 'mt-dup'}: record status and body. 5) labels.create {name: 'INBOX'} and {name: 'inbox'}: record status and body. 6) Delete the probes."

[[unknown]]
id = "label-edit-rename-parent"
question = "Does renaming a label through labels.patch rename its sublabels (labels whose name starts with `<old>/`) on Gmail's side?"
assumed = "No: the API changes one label; Gmail's web interface renames sublabels itself. mailtide renames each sublabel, sublabels first."
if_wrong = "Harmless: the sublabels are renamed first, so by the time the parent is patched nothing is left under the old prefix for Gmail to rename, and a patch to a name a label already has changes nothing."
test = "1) labels.create 'mt-p', 'mt-p/a' and 'mt-p/a/b'. 2) labels.patch the first with {name: 'mt-q'}. 3) labels.list: record the names of the other two (unchanged, or 'mt-q/a' and 'mt-q/a/b'). 4) Open Gmail's web interface and note how the two sublabels are shown. 5) Delete the probes."

[[unknown]]
id = "label-edit-delete-parent"
question = "Does labels.delete on a label delete its sublabels too?"
assumed = "No: only the named label goes; sublabels keep their names. mailtide refuses to delete a label that has sublabels unless asked to delete them, and then deletes each, deepest first."
if_wrong = "Safe: with sublabels = delete they are already gone when the parent is deleted. With the default the call is refused while the mirror shows sublabels; a sublabel created elsewhere seconds ago could then be deleted by Gmail along with its parent, and the next listing removes it from the mirror like any label deleted elsewhere."
test = "1) labels.create 'mt-d' and 'mt-d/child'; apply 'mt-d/child' to one inserted message. 2) labels.delete 'mt-d'. 3) labels.list: record whether 'mt-d/child' still exists. 4) messages.get the message: record whether it still carries the child's id. 5) Delete the probes."

[[unknown]]
id = "label-edit-color-rules"
question = "Does Gmail accept any textColor and backgroundColor pair taken from the documented palette, and does labels.patch with `color: null` clear a label's colour?"
assumed = "Any pair from the palette is accepted; a patch with a null color removes the colour and leaves name and visibility alone."
if_wrong = "A refused pair is a 400 that mailtide reports as Refused, recording nothing. If null does not clear, clearing a colour is refused the same way until it is implemented as labels.get plus labels.update with every other field copied; no other call uses the PUT."
test = "1) labels.create a probe with color {textColor: '#ffffff', backgroundColor: '#16a766'}: expect 200. 2) labels.patch it with a pair that Gmail's own picker does not offer together, e.g. {textColor: '#fb4c2f', backgroundColor: '#16a766'}: record status. 3) labels.patch with {textColor: '#123456', backgroundColor: '#16a766'}: expect 400. 4) labels.patch with {color: null}, then labels.get: record whether color is absent and whether name, labelListVisibility and messageListVisibility are unchanged. 5) Delete the probe."

[[unknown]]
id = "label-edit-modify-deleted-label"
question = "What does messages.modify answer when addLabelIds or removeLabelIds names a label id that was deleted?"
assumed = "HTTP 400 (invalid label), which the engine already treats as a permanent refusal of that change."
if_wrong = "If Gmail answers 404, today's engine would read it as `the message is gone` and tombstone a live message. This plan removes that risk whatever the answer: a 404 to a delivery enqueues a verification fetch, and only that fetch's own 404 tombstones the message."
test = "1) labels.create a probe and keep its id L; insert one message M. 2) labels.delete L. 3) messages.modify M with addLabelIds [L]: record status and error body. 4) messages.modify M with removeLabelIds [L]: record status and body. 5) messages.batchModify {ids: [M], addLabelIds: [L]}: record status and body. 6) messages.get M: expect it to exist. 7) messages.delete M. Run together with search-unknown-label-id (one deleted label id, used in a modify and in a listing)."
