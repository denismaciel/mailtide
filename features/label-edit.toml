id = "label-edit"
title = "Label editing: create, rename, delete, colour, visibility and nesting"
summary = "Label definitions gain visibility and colour in the mirror; create, rename, restyle and delete are quota-gated calls to Gmail's labels API whose answers are recorded at once; a deleted label, deleted here or elsewhere, leaves every mirrored message and cannot come back from a stale observation."
roadmap = ["W2"]
status = "approved"
design = "docs/features/label-edit.md"
# No dependency on another plan. It builds on what `main` has: Store::labels /
# Runner.labels() and the label refresh of SPEC §6.6 (EngineConfig::label_refresh,
# TimerKind::Labels, mailtide_accounts.labels_refreshed_at).
depends_on = []

