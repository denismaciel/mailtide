# ------------------------------------------------------------- other sources

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels"
note = "The Label resource, read 2026-11-20: the id is immutable; labelListVisibility is labelShow, labelShowIfUnread or labelHide; messageListVisibility is show or hide; color is a textColor and backgroundColor pair, both required, each from a fixed palette, user labels only; a mailbox holds at most 10,000 labels."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels/delete"
note = "Read 2026-11-20: `Immediately and permanently deletes the specified label and removes it from any messages and threads that it's applied to.` Scopes: mail.google.com, gmail.modify or gmail.labels."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels/patch"
note = "Read 2026-11-20: PATCH with a partial Label, answers the whole Label; no update mask. Same three scopes. labels.create documents the same scopes and says nothing about duplicate names."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/labels"
note = "Read 2026-11-20: a user label cannot take a system label's name (HTTP 400, Invalid label name); labels cannot be applied to drafts; the gmail.labels scope is enough to manage labels. Silent on nesting, on duplicates and on history."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20: labels.create 5, labels.update 5, labels.delete 5, labels.get 1, labels.list 1. labels.patch is not in the table."

[[source]]
url = "https://www.rfc-editor.org/rfc/rfc8621#section-2.5"
note = "Mailbox/set: parentId and name, destroy refused with mailboxHasChild or mailboxHasEmail unless onDestroyRemoveEmails. The shape our API borrows."

