id = "search"
title = "Search: a Gmail query to message and thread ids"
summary = "A read-only driver call that sends the host's query string to Gmail's own search through the quota gate and returns one page of ids, each marked with what the mirror holds for it; it parses no query, builds no index, caches nothing and writes nothing."
roadmap = ["R9"]
status = "in_progress"
design = "docs/features/search.md"
# No hard dependency. Soft links, none needed to build this:
#   threads (R7) hydrates thread hits; prioritise (S1) bumps a hit whose body is
#   not imported yet; send (C3) can reuse the search request and `by_message_id`
#   to confirm a send by Message-ID; drafts (C2) maps a DRAFT hit to its draft id.
depends_on = []

