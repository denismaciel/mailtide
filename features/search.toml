# ------------------------------------------------- unproven Gmail behaviour

[[unknown]]
id = "search-page-token-rejection"
question = "How does Gmail answer messages.list or threads.list with a pageToken it does not accept (altered, made up, or issued for other parameters)?"
assumed = "With HTTP 400, never with 200 and some other page."
if_wrong = "If Gmail answers 200, a bad token cannot be told from a good one and paging may repeat or end early without an error. mailtide already refuses, before calling Gmail, any token it did not issue for the same request, so only a token Gmail itself has forgotten is exposed; the contract then gains 'restart a paging run older than N', with N from search-page-token-lifetime. Any other 4xx is handled as the 400 is (PageTokenRejected)."
test = "On a mailbox with at least 5 messages: (1) GET users/me/messages?q=in:anywhere&maxResults=2&includeSpamTrash=true; keep nextPageToken T. (2) Repeat with pageToken=T: expect 200 and two other ids. (3) Repeat with T's last character changed, then with pageToken=garbage: record status and error body. (4) Send T with q=from:nobody@example.invalid, then with the original q and maxResults=1: record the status and whether the ids continue the first query. Repeat the four steps on users/me/threads."
status = "refuted"
result = "2026-11-20, messages.list and threads.list alike: nextPageToken is a 20-digit decimal number, not bound to the request. Only a token that does not parse is refused: one character replaced by a letter, the first digit changed, or `garbage` each got 400 INVALID_ARGUMENT (reason invalidArgument) \"Invalid pageToken\". Everything else is answered 200: the real token sent with a different q (`from:nobody@example.invalid`: 200, empty page), with another maxResults (200, continues the first listing), with labelIds in place of q or without includeSpamTrash (200, a page of that other listing from the same position); the token with its last digit changed (200, two other ids); token + 1,000,000 (200, empty); and made-up numeric tokens `12345`, `0`, `1` (200, some page or an empty one). So a wrong or foreign token cannot be told from a good one by Gmail's answer; if_wrong applies, and refusing tokens mailtide did not issue for the same request is the only protection."

[[unknown]]
id = "search-page-token-lifetime"
question = "How long does a nextPageToken stay valid, and does it survive changes to the mailbox?"
assumed = "At least an hour, also when messages arrive or are deleted in between; not for ever."
if_wrong = "If shorter, a host sees PageTokenRejected while the user scrolls and restarts from the first page, which is already the documented recovery; nothing is lost. mailtide never stores a token, so a longer life changes nothing."
test = "Take T as in search-page-token-rejection step 1. messages.insert one message that matches and messages.trash another. Use T after 1 minute, 1 hour, 24 hours and 7 days; each time record the status and, against a fresh full listing, whether ids repeat or are skipped."
status = "confirmed"
result = "2026-11-20: a nextPageToken taken at 08:17 UTC was accepted (200) 60 minutes later, for messages.list and threads.list with q=in:anywhere&includeSpamTrash=true, and returned the same two ids as when it was fresh, although about 900 messages had been inserted or sent and hundreds trashed in between. On an exact listing of 8 own messages (labelIds=<label>, maxResults=2): after a matching message was inserted and the first message of the next page was trashed, the token at 60 min returned the next two surviving messages, did not repeat page 1, did not include the new message, and walking on from it gave exactly the fresh listing minus page 1 and minus the new message (nothing repeated, nothing skipped). The token is a bare position (a 20-digit number), so it behaves like `older than this point`. Not measured: 24 hours and 7 days, and whether it ever expires."

[[unknown]]
id = "search-index-lag"
question = "How far does Gmail's search index trail a change that history.list already reports: a new message, a label change by messages.modify, a permanent delete?"
assumed = "Seconds, and less than confirm_timeout (60 s): by the time the mirror imports a new message or settles an action, a new search reflects it."
if_wrong = "A host that re-runs a search whenever the feed moves past the page's mirror_state could keep a page that is stale with no later feed entry to say so. The design note therefore tells hosts to pair mirror_state with a time limit; the measured lag sets the advised limit (Zero uses 30 s). mailtide keeps no page, so the mirror is not affected."
test = "(1) messages.insert a message with a unique subject token and labelIds [INBOX, UNREAD]; every second call messages.list?q=subject:<token> and history.list until both show it; record both delays. (2) messages.modify removeLabelIds [UNREAD]; poll q='subject:<token> is:unread' until it is empty; record the delay after the 200. (3) messages.delete it; poll q=subject:<token> with includeSpamTrash=true until it is gone; record the delay and whether the id was still listed after history.list showed messagesDeleted. Run together with send-lookup-latency (both poll messages.list with q after a change that history already shows)."
status = "confirmed"
result = "2026-11-20, 10 rounds on inserted messages: after messages.insert (INBOX, UNREAD) the message was in history.list on the first read (0.19 to 0.27 s after the answer) and in messages.list?q=subject:<token> on the first read (0.39 to 0.47 s). After messages.modify removed UNREAD, q=`subject:<token> is:unread` was already empty on the first read (0.19 to 0.24 s). After messages.trash, q=subject:<token> no longer listed it on the first read (0.20 to 0.22 s) while `in:trash` did. No stale search result was seen in 30 changes; the index did not trail history by a measurable amount. Not run: permanent delete (no scope; Trash stood in). Mail sent through the API is measured under send-lookup-latency."

[[unknown]]
id = "search-literal-quoting"
question = "Inside a double-quoted value, does Gmail still read OR, AND, braces and parentheses as syntax; is there an escape character; are lowercase or/and plain words?"
assumed = "As himalaya's translator assumes: they are syntax even inside quotes, nothing escapes them, lowercase or/and are words, and punctuation is skipped when words are matched."
if_wrong = "literal() turns those characters into spaces and lowercases a standalone OR or AND, so its output can match the same messages or fewer than the text meant, never more: over-cautious, not wrong. If quotes do protect them, literal() can keep the characters."
test = "messages.insert three messages with subjects 'zebrafish report', 'kangaroo report' and 'zebrafish OR kangaroo (draft) {x}'. List with q=subject:\"zebrafish OR kangaroo\", subject:\"zebrafish or kangaroo\", subject:\"zebrafish} OR {kangaroo\", subject:\"(draft)\", subject:\"draft\" and subject:\"from:alice\"; record the ids each returns. Under the assumption the first returns all three and the second only the third."
status = "refuted"
result = "2026-11-20, six inserted subjects, each query run 3 times with the same answer. Inside double quotes: OR is still an operator (`\"Z OR K\"` returns every message with Z or K) and so is `|`; braces are still an OR group (`\"{Z K}\"` returns every message with Z or K); AND is consumed as syntax and never matches the word (`\"K AND Z\"` equals the phrase `\"K Z\"`; `\"Z AND K\"` does not match the subject `Z and K`); AROUND works (`\"Z AROUND 2 K\"`); lowercase `or` / `and` are plain words; a backslash escapes nothing (`\"Z \\\"OR\\\" K\"`, `\"Z \\OR K\"` behave as `\"Z OR K\"`). Different from the assumption: parentheses inside quotes are NOT grouping, only skipped punctuation (`\"(Z K)\"` is the phrase `Z K`, while unquoted `(Z K)` is Z and K in any order). A minus or plus inside quotes is punctuation. `name:` inside quotes is unreliable: `\"from:alice\"` and `\"memo from alice end\"` matched the subject `memo from:alice end` but `\"memo from:alice\"` matched nothing. So besides OR/AND and braces, literal() must neutralise `|`, uppercase AROUND and a colon after a word; parentheses need no care."

[[unknown]]
id = "search-msgid-match"
question = "Does rfc822msgid: match exactly one Message-ID when given without angle brackets, and how must an id holding characters such as - = / $ ! % be written: bare or quoted?"
assumed = "A bare id of letters, digits and @ . _ + matches exactly that message; any other id matches when double-quoted."
if_wrong = "by_message_id() returns None for every id outside the set proven to match, instead of a term that may match nothing or another message. A caller (send, confirming by Message-ID) then treats the lookup as unavailable, never as 'not found'."
test = "messages.insert four messages with Message-ID <plain.1@x.test>, <a+b-c@x.test>, <a=b/c$d!e%f@x.test> and <plain.1@x.test.extra>. For each id run q=rfc822msgid:ID, q=rfc822msgid:<ID> and q=rfc822msgid:\"ID\" with includeSpamTrash=true. Expect exactly its own message each time; record every spelling that returns nothing or returns the .extra message."
status = "confirmed"
result = "2026-11-20, 4 inserted messages: q=rfc822msgid: returned exactly the message with that Message-ID for every spelling tried: bare, in angle brackets, double-quoted, and quoted with brackets, for <...plain.1@x.test>, <...a+b-c@x.test>, <...a=b/c$d!e%f@x.test> and <...plain.1@x.test.extra> (16 of 16; the id that is a prefix of another never returned the longer one). So the characters - = / $ ! % also match bare, not only quoted. Matching ignores case (the id in upper case found the message); the local part alone finds nothing. Each message was listed 0.2 s after messages.insert. This holds for ids Gmail stored as written (insert); a message sent through the API gets a Message-ID chosen by Gmail (send-message-id-kept)."

[[unknown]]
id = "search-label-terms"
question = "What does the label: operator in q accept: label names only or also label ids (Label_123), and how are spaces, slashes and case in a name written?"
assumed = "Names only, case-insensitive, with spaces and slashes written as hyphens; an id is not accepted. The labelIds parameter takes ids only."
if_wrong = "Nothing in mailtide depends on it: q is never rewritten and label_ids is the exact filter either way. Only the guidance changes ('filter by label with label_ids, not with label:')."
test = "labels.create 'Proj X/Sub a' (keep its id L) and add it to one message. List with q=label:proj-x-sub-a, q=label:\"Proj X/Sub a\", q=label:Proj-X/Sub-a, q=label:L, and with labelIds=L and no q; record which return the message. labels.patch the name and repeat the name forms and labelIds=L."
status = "confirmed"
result = "2026-11-20, label `<prefix>/Proj X/Sub a` on one message: label: matched it by name in every spelling tried: all lower case with spaces and slashes as hyphens, original case with hyphens, spaces as hyphens with slashes kept, and the exact name in double quotes (any case). label:<label id> (Label_NN, either case) matched nothing. The labelIds parameter matched by id; given the name it answered 400 INVALID_ARGUMENT \"Invalid label: <name>\". After labels.patch renamed the label, every spelling of the new name matched within 0.2 s, the old name matched nothing, and labelIds=<id> still matched."

[[unknown]]
id = "search-unknown-label-id"
question = "How do messages.list and threads.list answer a labelIds value that does not exist (never created, or deleted)?"
assumed = "With HTTP 400 naming the label, not with 200 and no results."
if_wrong = "A filter on a deleted label would look like an empty result. mailtide would then check label_ids against the mirror's label definitions and refuse an id it does not hold (UnknownLabel) before calling Gmail."
test = "GET users/me/messages?labelIds=Label_doesnotexist&q=in:anywhere; then labels.create a label, labels.delete it and list with its id. Repeat on users/me/threads. Record status and error body. Run together with label-edit-modify-deleted-label (one deleted label id, used in a listing and in a modify)."
status = "refuted"
result = "2026-11-20: a labelIds value that does not exist is not an error. messages.list and threads.list answered 200 with no messages/threads and resultSizeEstimate 0 for a never-created id (Label_doesnotexist, Label_999999999) and for the ids of 3 labels deleted seconds before, with and without q. Nothing distinguishes it from an empty result. if_wrong applies: check label_ids against the mirror's label definitions before calling Gmail."

[[unknown]]
id = "search-spam-trash-default"
question = "With includeSpamTrash unset, do the q terms in:trash, in:spam and in:anywhere return messages in Trash and Spam?"
assumed = "in:trash and in:spam do (Zero lists its bin with in:trash and no flag); in:anywhere needs includeSpamTrash=true."
if_wrong = "Hosts pass include_spam_trash=true for those searches. mailtide passes the flag through unchanged and its default (false) stays; only the guidance changes."
test = "messages.trash one message and add SPAM to another, both with a unique subject token. Run q='subject:<token> in:trash', '... in:spam', '... in:anywhere' and 'subject:<token>' alone, each with includeSpamTrash absent, false and true; record the ids returned."
status = "refuted"
result = "2026-11-20, three messages with one subject token (one normal, one in TRASH, one given SPAM by messages.modify): with includeSpamTrash absent or false, `in:trash` returned the trashed one and `in:spam` the spam one, as assumed; but `in:anywhere` returned all three with the flag absent, false or true, so it does not need includeSpamTrash. Only a q without any of those terms depends on the flag (normal only when absent/false, all three when true). Also: `label:trash`, `is:spam`, `(in:trash OR in:spam)` and labelIds=TRASH / labelIds=SPAM without q all return Trash/Spam messages with the flag absent."

[[unknown]]
id = "search-thread-history-id"
question = "Does every thread in a threads.list page carry historyId, and is it the id of the last change to any message of the thread?"
assumed = "Yes: Zero and himalaya both read it from the list, and the Thread resource describes historyId as the last history record that modified the thread."
if_wrong = "ThreadHit.history_id is optional. Without it a host cannot tell that the mirror trails Gmail for that thread and runs a sync before hydrating thread hits."
test = "threads.list?q=subject:<token> for a thread of two messages; record whether historyId is present. messages.modify one of its messages, read history.list from the earlier historyId, list again: expect the thread's historyId to be the id of that history record or a later one."
status = "confirmed"
result = "2026-11-20: every entry of a threads.list page of 500 threads (includeSpamTrash=true) carried historyId; entry keys are id, snippet, historyId. For 3 two-message probe threads: after messages.modify on one message, history.list from the id read before showed the labelsAdded record with id R; threads.list then gave the thread historyId R+1, equal to threads.get's historyId and to that message's own historyId (the other message kept its older one). So the thread's historyId is the largest historyId among its messages, and is at or after the history record of the last change."

[[unknown]]
id = "search-drafts-in-results"
question = "Does messages.list with q return draft messages (label DRAFT), under the draft's current message id?"
assumed = "Yes: 'in:draft <words>' returns the current message of each matching draft."
if_wrong = "Searching drafts would need drafts.list?q= (5 units), which returns draft ids directly. That call would be added to the drafts feature; nothing here changes."
test = "drafts.create a draft with a unique subject token. messages.list?q='in:draft subject:<token>' and ?q='subject:<token>': expect the draft's message id in both. drafts.update it and list again: expect only the new message id."
status = "confirmed"
result = "2026-11-20, 3 drafts: messages.list with q=`in:draft subject:<token>` and with q=`subject:<token>` each returned exactly the draft's current message id, 0.2 to 0.5 s after drafts.create. After drafts.update both queries returned only the new message id on the first read (0.4 s after the answer), never the old one. After drafts.delete neither lists anything. drafts.list?q=subject:<token> returns the draft id too."
