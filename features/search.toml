[[suite]]
impl = "zero"
path = "apps/server/src/lib/mail-search-store.test.ts"
target = "crates/mailtide-io/tests/ref_zero_mail_search_store.rs"

[[suite.test]]
name = "mailbox search membership cache > coalesces repeated searches, persists pages across restart, and expires them after 30 seconds"
na = "No result cache and no in-flight sharing: every call asks Gmail (5 or 10 units). A host that wants this cache keys it on the page's mirror_state (design note, Decisions 6)"

[[suite.test]]
name = "mailbox search membership cache > canonicalizes label sets but preserves quoted query whitespace and opaque page tokens"
test = "label_ids_are_canonical_and_the_query_and_gmails_page_token_go_out_byte_for_byte"
note = "Zero's cache key becomes our request: label ids are deduplicated and sorted; q keeps its case and inner whitespace; Gmail's token is carried verbatim inside ours. Unlike Zero we do not trim q either."

[[suite.test]]
name = "mailbox search membership cache > separates folder, page size, label filters, pages, and mailbox storage"
test = "a_page_token_is_bound_to_its_account_query_filters_and_page_size"
note = "Cache identity becomes page-token identity: a token issued for one request is refused for another account, query, label filter, scope, spam/trash flag or limit. There is no folder parameter."

[[suite.test]]
name = "mailbox search membership cache > refreshes when history advances and fences an invalidated in-flight response"
test = "mirror_state_is_read_before_gmail_is_asked_so_a_change_during_the_call_marks_the_page_stale"
note = "The fence a host cache needs: a commit or an admitted action that lands while the request is in flight is after the page's mirror_state, so changes(since = mirror_state) is not empty."

[[suite.test]]
name = "mailbox search membership cache > does not cache provider errors or substitute stale membership for a failed refresh"
test = "a_failed_or_deferred_search_is_an_error_never_an_empty_or_older_page"

[[suite.test]]
name = "mailbox search membership cache > bounds persistent cache growth and prunes expired pages on new searches"
na = "Nothing is stored: search adds no table and writes no row"

