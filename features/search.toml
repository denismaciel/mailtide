note = "Read 2026-11-20. The same parameters for threads; a listed thread has no messages."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/guides/filtering"
note = "Read 2026-11-20. The API does not do the UI's alias expansion or thread-wide search; a bare date is midnight PST, a value in seconds is exact."

[[source]]
url = "https://developers.google.com/workspace/gmail/api/reference/quota"
note = "Read 2026-11-20. messages.list 5 units, threads.list 10 units; 6,000 units per minute per user."

[[source]]
url = "https://support.google.com/mail/answer/7190"
note = "Read 2026-11-20. The search operators: label:, rfc822msgid:, in:anywhere ('includes emails in Spam and Trash'), OR and braces, quotes for an exact phrase, parentheses, after: and before:. It does not specify precedence, escaping, or how a label name with spaces is written."

[[source]]
