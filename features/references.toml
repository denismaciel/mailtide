# Reference implementations that feature plans cite (see docs/features/README.md).
#
# Each is pinned to a commit so `scripts/features.py` can check that every cited
# file and test still exists. Checkouts live under $MAILTIDE_REFS (default
# ~/.cache/mailtide/refs) in `checkout`; `scripts/features.py refs --fetch` clones them.
#
# `copy` says what may be carried into mailtide (MIT OR Apache-2.0):
#   code   permissive licence: code and tests may be ported, with the licence notice.
#   names  copyleft: record file paths and test names only. Never copy code or test bodies.

[zero]
repo = "https://github.com/Mail-0/Zero"
commit = "4b642dfd9890a1fdcb1b98a177fe74ca3142c445"
license = "MIT"
copy = "code"
checkout = "zero"
lang = "typescript"

