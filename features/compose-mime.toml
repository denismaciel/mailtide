# ------------------------------------------- Gmail behaviour assumed, not proven

[[unknown]]
id = "compose-mime-date-kept"
question = "Does Gmail send the Date header the client wrote, in particular for a draft sent long after it was composed, and what does it do when there is none?"
assumed = "It sends the Date as written and adds one only when it is missing."
if_wrong = "Harmless in both directions: if Gmail restamps Date at send time the advice to save a draft once more before sending it becomes unnecessary; compose keeps writing Date because RFC 5322 requires it."
test = "Build raw with `Date:` 72 hours in the past. POST users.drafts.create, then users.drafts.send; GET the SENT copy format=raw and the recipient's copy: compare Date with the one written and with internalDate. Repeat with users.messages.send. Repeat both with no Date header at all and record the Date Gmail writes, if any. Run together with drafts-message-id-kept and send-message-id-kept: the same sends, with the Date set back."
status = "refuted"
result = "2026-11-20: Gmail rewrites Date on every path. A Date 72 h in the past (and one 10 min in the past written in +0100) was replaced by the time of the call, written in -0800, in the SENT message of messages.send (metadata URI x4, resumable x1) and of drafts.send (x4); internalDate equals that time. Sends whose Date was current had it rewritten into -0800 as well. drafts.create and drafts.update also rewrite the stored draft's Date to the time of the save, so a draft never keeps the composer's Date either. With no Date header Gmail adds one (appended after the last client header) with the send time (3 of 3). Only messages.insert keeps Date as written. The recipient's copy was read only for mail to the account itself (the same stored message). So Date as written is never sent; the advice to save a draft again before sending is unnecessary."

[[unknown]]
id = "compose-mime-rfc2231-filename"
question = "Does Gmail read an attachment file name given only as RFC 2231 parameters (`filename*=UTF-8''...`, `filename*0*=`/`filename*1*=`, and quoted `filename*0=`/`filename*1=` continuations)?"
assumed = "Yes: users.messages.get reports the decoded name in payload.parts[].filename and Gmail's web UI shows it."
if_wrong = "Non-ASCII or long file names would arrive garbled or unnamed. compose then also writes the name the way Gmail itself does, as an RFC 2047 encoded word in the Content-Type `name` parameter, next to the RFC 2231 form."
test = "Compose a message to self with three attachments: one named `résumé.pdf` (written `filename*=UTF-8''r%C3%A9sum%C3%A9.pdf`), one with a 120-character non-ASCII name (split into `*0*`, `*1*` sections), one with a 120-character ASCII name (quoted `*0`, `*1` continuations). POST users.messages.send; GET users.messages.get format=full on the SENT copy: payload.parts[1..3].filename must equal the three names exactly. Open it in Gmail's web UI and check the three attachment names. Repeat through users.drafts.create and users.drafts.get format=full."

[[unknown]]
id = "compose-mime-inline-related"
question = "Does Gmail show an image inline, and not as an attachment, when it sits in multipart/related under the HTML alternative (alternative > [text, related > [html, image]]) and is referenced by `cid:`?"
assumed = "Yes: this is the layout RFC 2387 describes and other clients send; Gmail's own composer nests the other way round (related > [alternative, image]) and is assumed to read both."
if_wrong = "Inline images would show as attachments or not at all. compose switches to Gmail's own nesting, a change confined to the function that builds the tree; the input type and every other test stay."
test = "Compose to self: text, html containing `<img src=\"cid:probe1\">`, one inline PNG with content id `probe1`, one PDF attachment. POST users.messages.send; GET users.messages.get format=full on the SENT copy and record the payload tree (mimeType of each node, the image's Content-ID and Content-Disposition headers). In Gmail's web UI and one mobile client: the image renders in the body and only the PDF is listed as an attachment. Repeat through users.drafts.create and open the draft in Gmail's web composer: the image is in the editor."
