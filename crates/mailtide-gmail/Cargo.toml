[package]
name = "mailtide-gmail"
description = "Gmail API wire layer for mailtide: typed requests and responses, push verification"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mailtide = { path = "../mailtide", version = "0.2.1" }
base64 = "0.23"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
