[package]
name = "mailtide-mime"
description = "MIME for mailtide: message facts and part ranges of stored messages, composing outgoing ones"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mailtide = { path = "../mailtide", version = "0.3.0" }
encodify = "1"
mail-builder = { version = "2", default-features = false }
mail-parser = "1"

[dev-dependencies]
mailtide-gmail = { path = "../mailtide-gmail", version = "0.3.0" }
base64 = "0.23"
serde_json = "1"

[lints]
workspace = true
