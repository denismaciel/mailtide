[package]
name = "mailtide-py"
description = "Python bindings for the mailtide sync engine"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
mailtide = { path = "../mailtide", version = "0.2.1" }
mailtide-gmail = { path = "../mailtide-gmail", version = "0.2.1" }
mailtide-io = { path = "../mailtide-io", version = "0.2.1" }
mailtide-mime = { path = "../mailtide-mime", version = "0.2.1" }
mailtide-store = { path = "../mailtide-store", version = "0.2.1" }
getrandom = "0.4"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }

[lints]
workspace = true
